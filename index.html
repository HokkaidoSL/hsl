<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>北海道サッカーリーグ</title>
<link rel="icon" href="./new/img/hsl-logo.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #FFFFFF; }
  iframe { display: block; border: 0; width: 100%; height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<script>
  // 公式サイトは new/。?page=… のときは大会運営システム（Apps Script のWebアプリ）を開く
  // ↓ Apps Script のWebアプリURL（/exec で終わるもの）。デプロイしたら書き換える
  var EXEC = '';
  var q = location.search || '';
  var m = q.match(/[?&]page=([^&]+)/);
  if (m && EXEC) {
    var titles = { lineup: 'スタメン提出・運営クラブ', bulk: '一括登録', approve: '公式記録 承認', referee: '審判報告書',
      confirm: '処分の確認', notice: '決定通知の承認', 'public': '日程・結果', official: '公式記録入力', mc: 'MC報告書' };
    if (titles[m[1]]) document.title = titles[m[1]] + '｜北海道サッカーリーグ';
    var f = document.createElement('iframe');
    f.id = 'app'; f.title = '北海道サッカーリーグ'; f.allow = 'clipboard-write'; f.src = EXEC + q;
    document.body.appendChild(f);
  } else {
    location.replace('./new/' + (m ? '' : ''));
  }
</script>
<noscript><a href="./new/">北海道サッカーリーグ 公式サイト</a></noscript>
</body>
</html>
