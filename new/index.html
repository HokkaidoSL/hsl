<script>
chrome('./');
const today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
let C=[],ALL=[],CUR=null,ROUNDS=[],RI=0,DATES=[],SEL='',NEWS=[];
const withLive=m=>{const lv=liveOf(m);return lv?{...m,score:{home:lv.score.home,away:lv.score.away,pk:lv.pk},_live:lv}:m};
const lostSide=m=>done(m)&&m.winner&&m.winner!=='DRAW'?(m.winner===m.home.id?'away':'home'):'';
const KC=c=>c.code==='TOP'?'TOP':/^(SD|DN|DT)$/.test(c.code)?'BLK':c.code==='BF'?'BF':'CUP';

/* ---------- 大会の切り替え ---------- */
function pickComp(code){
  CUR=C.find(c=>c.code===code)||C[0];
  $('cswitch').innerHTML=switchHTML(C,CUR.code);
  ROUNDS=buildRounds(CUR);
  const i=ROUNDS.findIndex(r=>r.list.some(m=>!done(m)));
  RI=i>=0?i:ROUNDS.length-1;
  $('sMore').href='./results.html?comp='+encodeURIComponent(CUR.id)+'&tab=standings';
  renderFeat();renderMatches();renderStandings();
  try{history.replaceState(null,'','?'+(QS.get('y')?'y='+QS.get('y')+'&':'')+'c='+CUR.code)}catch(e){}
}

/* ---------- いちばん上の大きな写真：注目の試合（試合中 → いちばん近い次の試合 → いちばん新しい結果）と、同じ節の試合 ---------- */
function featured(c){
  const ms=order(c.data.matches).filter(m=>m.home&&m.away);
  return ms.find(m=>liveOf(m))||ms.find(m=>!done(m)&&(m.date||'')>=today)||[...ms].reverse().find(done)||ms[0];
}
let HI=0;
/* 白い文字が読めるよう、明るすぎる色は暗くする */
function deepen(c){
  if(!/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(c||''))return '';
  let h=c.slice(1);if(h.length===3)h=h.replace(/./g,x=>x+x);
  let v=[0,2,4].map(i=>parseInt(h.substr(i,2),16));
  const L=(0.2126*v[0]+0.7152*v[1]+0.0722*v[2])/255;
  if(L>0.5)v=v.map(x=>x*0.5/L);
  return 'rgb('+v.map(Math.round).join(',')+')';
}
/* チームの色：チーム紹介の「チームカラー」→ 調べた色（team-colors.json）→ エンブレムの中でいちばん多いあざやかな色（同じサイトに置いた画像だけ読める） */
const ECOL=new Map();
/* エンブレムの画像を読み、いちばん多いあざやかな色（color）と、絵の部分の明るさ（lum：0〜1）を返す */
function emblemInfo(u){
  if(ECOL.has(u))return ECOL.get(u);
  const p=new Promise(res=>{
    if(!/^\.\//.test(u))return res({});
    const im=new Image();
    im.onload=()=>{try{
      const n=48,cv=document.createElement('canvas');cv.width=cv.height=n;const x=cv.getContext('2d');x.drawImage(im,0,0,n,n);
      const d=x.getImageData(0,0,n,n).data,bins={};let ls=0,ln=0,lt=0;
      for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];if(d[i+3]<200)continue;const y=(0.2126*r+0.7152*g+0.0722*b)/255;ls+=y;ln++;if(y>0.7)lt++;
        const mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx-mn<70||mx<60)continue;
        const k=(r>>5)+'.'+(g>>5)+'.'+(b>>5),o=bins[k]=bins[k]||{n:0,r:0,g:0,b:0};o.n++;o.r+=r;o.g+=g;o.b+=b}
      let best=null;for(const o of Object.values(bins))if(!best||o.n>best.n)best=o;
      res({color:best&&best.n>=24?'#'+[best.r,best.g,best.b].map(v=>Math.round(v/best.n).toString(16).padStart(2,'0')).join(''):'',lum:ln?ls/ln:1,light:ln?lt/ln:0});
    }catch(e){res({})}};
    im.onerror=()=>res({});im.src=u;
  });
  ECOL.set(u,p);return p;
}
function paintHalves(){
  document.querySelectorAll('#htrack .half[data-img]').forEach(h=>emblemInfo(h.dataset.img).then(o=>{
    if(h.dataset.need&&o.color){const v=deepen(o.color);if(v)h.style.setProperty('--c',v)}
    const m=getComputedStyle(h).backgroundColor.match(/\d+/g)||[],bg=m.length>=3?(0.2126*m[0]+0.7152*m[1]+0.0722*m[2])/255:0.5;
    // 暗いエンブレムが暗い色の上にのるとき：白い絵がほとんどない（BTOP など）→ 白くする。白い絵がある（sabas・コパンなど）→ ほかと同じ薄さで、ふちを明るく
    const dark=o.lum!=null&&o.lum<0.3&&bg<0.3;
    h.classList.toggle('inv',dark&&o.light<0.03);
    h.classList.toggle('ring',dark&&o.light>=0.03);
  }));
}
function heroMatches(c){
  const m0=featured(c);if(!m0)return [];
  const same=order(c.data.matches).filter(m=>m!==m0&&m.home&&m.away&&m.round===m0.round)
    .sort((a,b)=>(!!liveOf(b)-!!liveOf(a))||(done(a)-done(b)));
  return [m0].concat(same).slice(0,4);
}
function heroSlide(m0){
  const m=withLive(m0),f=done(m),lv=m._live,lose=lostSide(m0),dt=/^(\d{4})-(\d{2})-(\d{2})$/.exec(m.date||'');
  const side=(t,k)=>{
    const e=emblemOf(t),own=deepen(teamColorOf(t)),nm=[...(t.short||t.name||'')].slice(0,2).join(''),lz=lose===(k==='l'?'home':'away')?' lose':'';
    return {
      half:'<div class="half '+k+lz+'" style="--c:'+(own||(k==='l'?'#1d3350':'#2a4262'))+'"'+(e?' data-img="'+esc(e)+'"'+(own?'':' data-need="1"'):'')+'>'+
        '<a class="big'+(e?'':' txt')+'" href="'+teamUrl(t)+'" aria-label="'+esc(t.name)+'">'+(e?'<img src="'+esc(e)+'" alt="" onerror="this.parentNode.classList.add(\'txt\');this.parentNode.textContent=\''+esc(nm)+'\'">':esc(nm))+'</a></div>',
      tm:'<a class="tm'+lz+'" href="'+teamUrl(t)+'"><span>'+esc(t.name)+'</span></a>'
    };
  };
  const H=side(m.home,'l'),A=side(m.away,'r');
  const st=lv?'<span class="badge live">'+esc(HSL_LIVE.label(lv))+'</span>':f?'<span class="badge done">試合終了</span>':m.date===today?'<span class="badge new">今日の試合</span>':'';
  const mid=(f||lv?'<div class="sc">'+esc(m.score.home)+' - '+esc(m.score.away)+'</div>'+(m.score.pk?'<div class="ko">PK '+esc(m.score.pk.home)+' - '+esc(m.score.pk.away)+'</div>':'')+
      '<div class="vn">'+esc(dt?(+dt[2])+'/'+(+dt[3])+'（'+wd(m.date)+'）':'')+'</div>':
    '<div class="day">'+(dt?(+dt[2])+'.'+(+dt[3])+'<small>'+wd(m.date)+'</small>':'日程未定')+'</div>'+(m.kickoff?'<div class="ko">'+esc(m.kickoff)+' KO</div>':''));
  return '<article class="hs" role="group" aria-roledescription="スライド" aria-label="'+esc(m.home.short+' 対 '+m.away.short)+'">'+H.half+A.half+
    '<div class="in">'+H.tm+'<div class="mid"><span class="comp" style="--k:'+(KCOL[CUR.code]||'#fff')+'"><i></i>'+esc(CUR.short)+'</span><div class="rd">'+esc(m.round||'')+'</div>'+mid+'</div>'+A.tm+
      '<div class="below">'+(m.venue?'<div class="vn">'+esc(m.venue)+'</div>':'')+(st?'<div class="st">'+st+'</div>':'')+'</div></div>'+
    '<a class="cta" href="'+matchUrl(CUR.id,m)+'">'+(f||lv?'試合の詳細はこちら':'試合情報はこちら')+'</a></article>';
}
function renderFeat(){
  const ms=CUR?heroMatches(CUR):[];
  const html=ms.map(heroSlide);
  $('htrack').innerHTML=html.length?html.join(''):'<article class="hs" style="background:var(--card)"><div class="in"><span></span><p class="mid">この大会の試合はまだありません。</p></div></article>';
  heroDotsBuild();heroGo(HI,false);paintHalves();
}
function heroDotsBuild(){
  const n=$('htrack').children.length;
  $('hdots').innerHTML=n>1?Array.from({length:n},(_,i)=>'<button aria-label="'+(i+1)+'枚目"></button>').join(''):'';
  [...$('hdots').children].forEach((b,i)=>b.onclick=()=>{heroHold();heroGo(i)});
}
function heroGo(i,smooth){
  const tr=$('htrack'),n=tr.children.length;if(!n)return;
  HI=((i%n)+n)%n;tr.scrollTo({left:HI*tr.clientWidth,behavior:smooth===false?'auto':'smooth'});
  [...$('hdots').children].forEach((b,j)=>b.setAttribute('aria-current',String(j===HI)));
}
/* 7秒ごとに次へ。さわったら少し止める。動きを減らす設定の人には動かさない */
let HOLD=0;
const heroHold=()=>{HOLD=Date.now()+15000};
$('htrack').addEventListener('scroll',()=>{const tr=$('htrack'),i=Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth));if(i!==HI){HI=i;[...$('hdots').children].forEach((b,j)=>b.setAttribute('aria-current',String(j===HI)))}},{passive:true});
['pointerdown','touchstart','wheel'].forEach(ev=>$('htrack').addEventListener(ev,heroHold,{passive:true}));
addEventListener('resize',()=>heroGo(HI,false));
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(()=>{if(Date.now()>HOLD&&!document.hidden&&$('htrack').children.length>1)heroGo(HI+1)},7000);

/* ---------- 試合カード（節ごと） ---------- */
function buildRounds(c){
  const map=new Map();
  for(const m of order(c.data.matches)){const k=m.round||'日程';if(!map.has(k))map.set(k,[]);map.get(k).push(m)}
  return [...map].map(([label,list])=>({label,list}));
}
function card(m0){
  const m=withLive(m0),f=done(m),lv=m._live,lose=lostSide(m0);
  const st=lv?'<span class="badge live">'+esc(HSL_LIVE.label(lv))+'</span>':f?'<span class="badge done">試合終了</span>':'<span class="badge">'+esc(m.kickoff?m.kickoff+' KO':'時間未定')+'</span>';
  const row=(t,side)=>'<div class="row'+(lose===side?' lose':'')+'">'+crest(t,'sm')+'<span>'+esc(t.short||t.name)+'</span><b>'+(f?esc(m.score[side])+(m.score.pk?'<small style="font-size:13px"> ('+esc(m.score.pk[side])+')</small>':''):'')+'</b></div>';
  return '<article class="card mc"><div class="top"><span>'+esc(md(m.date)+'（'+wd(m.date)+'）')+'</span>'+st+'</div>'+row(m.home,'home')+row(m.away,'away')+
    '<div class="venue">'+esc(m.venue||'会場未定')+'</div><a class="go" href="'+matchUrl(CUR.id,m)+'">'+(f||lv?'試合の詳細':'試合の情報')+'</a></article>';
}
function renderMatches(){
  const r=ROUNDS[RI];
  $('rLabel').textContent=r?r.label:'–';
  $('prevR').disabled=RI<=0;$('nextR').disabled=RI>=ROUNDS.length-1;
  $('mrow').innerHTML=r?r.list.map(card).join(''):'<p class="empty">試合データがありません。</p>';
  $('mrow').scrollLeft=0;
}
$('prevR').onclick=()=>{RI--;renderMatches()};$('nextR').onclick=()=>{RI++;renderMatches()};

/* ---------- 順位（直近5試合は大会記録のページに出す） ---------- */
const ZONE={TOP:(r,n)=>r===1?'hi':r===n?'dn':r===n-1?'po':'',DN:r=>r===1?'up':'',DT:r=>r===1?'up':'',SD:r=>r===1?'up':'',BF:r=>r<=2?'up':''};
const ZNOTE={TOP:[['hi','優勝'],['po','決勝大会へ（入替）'],['dn','ブロックリーグへ降格']],BF:[['up','北海道リーグへ昇格']],SD:[['up','決勝大会へ']],DN:[['up','決勝大会へ']],DT:[['up','決勝大会へ']]};
function standTable(c,rows,full){
  const z=ZONE[c.code]||(()=>''),n=rows.length;
  return '<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>順位</th><th class="l">クラブ</th><th>勝点</th><th>試合</th>'+
    (full?'<th class="hide-sp">勝</th><th class="hide-sp">分</th><th class="hide-sp">負</th><th class="hide-sp">得点</th><th class="hide-sp">失点</th>':'')+'<th>得失</th>'+'</tr></thead><tbody>'+
    rows.map(r=>{const k=z(r.rank,n);return '<tr'+(k?' data-z="'+k+'"':'')+'><td class="rk">'+r.rank+'</td><td class="l"><a class="tn" href="'+teamUrl(r.team)+'">'+crest(r.team,'xs')+'<span>'+esc(r.team.short)+'</span></a></td><td class="pt">'+r.points+'</td><td class="n">'+r.played+'</td>'+
      (full?'<td class="n hide-sp">'+r.won+'</td><td class="n hide-sp">'+r.drawn+'</td><td class="n hide-sp">'+r.lost+'</td><td class="n hide-sp">'+r.goalsFor+'</td><td class="n hide-sp">'+r.goalsAgainst+'</td>':'')+
      '<td class="n">'+(r.goalDiff>0?'+':'')+r.goalDiff+'</td>'+'</tr>'}).join('')+'</tbody></table></div>';
}
function renderStandings(){
  const c=CUR,g=(c.data.groups||[]).find(g=>/上位/.test(g.group||''))||(c.data.groups||[])[0];
  if(g&&g.table&&g.table.length){
    const zn=ZNOTE[c.code]||[];
    $('sBody').innerHTML=standTable(c,g.table,true)+(zn.length?'<div class="zl">'+zn.map(([k,t])=>'<span style="--zc:var('+({hi:'--logo-b',up:'--logo-g',po:'--logo-y',dn:'--red-bg'})[k]+')"><i></i>'+t+'</span>').join('')+'</div>':'');
    return;
  }
  // トーナメント：決勝・代表決定戦の結果
  const fin=order(c.data.matches).filter(m=>isFinal(m));
  $('sBody').innerHTML=fin.length?'<div class="cups">'+fin.map(m=>{const f=done(m),w=f?(m.winner===m.away.id?m.away:m.home):null,l=w?(w===m.home?m.away:m.home):null;
      return '<a class="card cup" href="'+matchUrl(c.id,m)+'"><span class="lb">'+esc(m.round)+'</span>'+(w?'<span class="w">'+crest(w,'sm')+esc(w.name)+'</span><span class="note">'+esc(c.code==='HC'?'優勝':'北海道代表')+'（相手：'+esc(l.short||l.name)+'）</span><span class="s">'+esc(scoreText(m))+'</span>':'<span class="w">'+esc(m.home.short)+' vs '+esc(m.away.short)+'</span><span class="s">'+esc(md(m.date))+'</span>')+'</a>'}).join('')+'</div>'+
    '<p style="margin:12px 0 0"><a class="btn" href="'+compUrl(c.id,'')+'">トーナメント表を見る »</a></p>':
    '<div class="card"><p class="empty">まだ順位・結果がありません。</p></div>';
}

/* ---------- 試合カレンダー（すべての大会） ---------- */
function renderDays(){
  const mon=SEL.slice(0,7),months=[...new Set(DATES.map(d=>d.slice(0,7)))];
  $('months').innerHTML=months.map(m=>'<button role="tab" data-m="'+m+'" aria-selected="'+(m===mon)+'">'+(+m.slice(5))+'月</button>').join('');
  $('days').innerHTML=DATES.filter(d=>d.slice(0,7)===mon).map(d=>{const w=new Date(d+'T00:00:00').getDay(),ks=[...new Set(ALL.filter(m=>m.date===d).map(m=>KC(m._c)))];

function renderDay(){

/* ---------- お知らせ ---------- */
async function renderNews(){

  NEWS=(d.news||[]).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,5);
  const fresh=s=>s&&(Date.parse(today)-Date.parse(String(s).slice(0,10)))<=7*864e5;
  $('newsList').innerHTML=NEWS.length?NEWS.map(n=>'<a href="./news.html?id='+encodeURIComponent(n.id)+'"><time>'+esc(String(n.date||'').slice(0,10).replace(/-/g,'.'))+'</time><span>'+(n.important?'<span class="badge live" style="margin-right:6px">重要</span>':'')+(fresh(n.date)?'<span class="badge new" style="margin-right:6px">NEW</span>':'')+esc(n.title)+'</span></a>').join(''):'<p class="empty">まだお知らせはありません。</p>';
}

/* ---------- リーグのつながり ---------- */
function renderPyramid(){
  // 順位表はほかの所にあるので、ここは「リーグの名前・クラブ数・いまの1位」と、昇格・降格の決まりだけ
  const by=Object.fromEntries(C.map(c=>[c.code,c]));
  const grp=c=>(c.data.groups||[]).find(g=>/上位/.test(g.group||''))||(c.data.groups||[])[0];
  const box=k=>{const c=by[k];if(!c)return '';const g=grp(c),t=g&&g.table||[],r=t.find(x=>x.rank===1);
    const n=new Set((c.data.matches||[]).flatMap(m=>[m.home&&m.home.id,m.away&&m.away.id]).filter(Boolean)).size||t.length;
    const ld=r&&r.played?'<em>1位</em>'+crest(r.team,'xs')+'<span>'+esc(r.team.short)+'</span>':'<em>まだ試合がありません</em>';
    return '<a class="card box" href="'+compUrl(c.id,'standings')+'" style="--k:'+(KCOL[k]||'var(--ink)')+'"><span class="nm"><b>'+esc(c.short)+'</b><small>'+(n?n+'クラブ':'')+'</small></span><span class="ld">'+ld+'</span></a>'};
  $('pyr').innerHTML=
    '<div class="lvl">'+box('TOP')+'</div>'+
    '<div class="arrow"><span class="u">決勝大会の上位2クラブが昇格</span><span class="d">7位は決勝大会へ・8位はブロックリーグへ</span></div>'+
    '<div class="lvl">'+box('BF')+'</div>'+
    '<div class="arrow"><span class="u">各ブロックの1位が決勝大会へ</span></div>'+
    '<div class="lvl l3">'+['SD','DN','DT'].map(box).join('')+'</div>';
}

/* ---------- 大会の一覧 ---------- */

  $('comps').innerHTML=C.map(c=>{const w=winners(c),ms=c.data.matches||[],dn=ms.filter(done).length;
    const st=w.list.length?'<strong>'+esc(w.label)+'</strong>'+w.list.map(t=>crest(t,'xs')+esc(t.short||t.name)).join('　'):(ms.length?dn+' / '+ms.length+'試合 終了':'日程はまだです');

/* ---------- 写真（管理画面のトップ写真など。自分でずらして見る） ---------- */
(async()=>{
  await embReady;
  renderNews().catch(()=>{});
  C=await loadAll();
  if(!C.length)throw new Error('大会のデータがありません');
  ALL=C.flatMap(c=>c.data.matches.filter(m=>/^\d{4}-\d{2}-\d{2}$/.test(m.date||'')).map(m=>({...m,_c:c})));
  DATES=[...new Set(ALL.map(m=>m.date))].sort();
  $('cswitch').onclick=e=>{const b=e.target.closest('[data-c]');if(b)pickComp(b.dataset.c)};
  $('mTitle').insertAdjacentHTML('afterend',seasonSelect(SEASON,'season'));
  pickComp(QS.get('c')||'TOP');
  pickDay([...DATES].reverse().find(d=>d<=today)||DATES[0]);
  renderPyramid();renderComps();
  /* 速報が届いたら描き直す */
  if(window.HSL_LIVE)HSL_LIVE.on(()=>{if(CUR){const x=$('mrow').scrollLeft;renderFeat();renderMatches();$('mrow').scrollLeft=x}if(SEL)renderDay()});
})().catch(e=>{$('htrack').innerHTML='<article class="hs" style="background:var(--card)"><div class="in"><span></span><p class="mid">読み込めませんでした。時間をおいて開き直してください。（'+esc(e.message)+'）</p></div></article>'});
</script>
