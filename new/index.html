<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>北海道サッカーリーグ | 公式サイト</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="./img/hsl-logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="./site.css?v=20261012c">
<style>
/* トップ：① 試合のカード（今のトップと同じ） ② カレンダー ③ リーグのつながり */

/* ① 試合のカード：大会を選び、節（ラウンド）ごとに横に並べる */
.ticker{background:var(--card);border-bottom:1px solid var(--line)}
.ctabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.ctabs::-webkit-scrollbar{display:none}
.ctabs button{flex:none;border:0;background:transparent;padding:12px 12px 9px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.ctabs button:hover{color:var(--ink)}
.ctabs button[aria-selected=true]{color:var(--acc);border-bottom-color:var(--acc)}
.season{display:flex;align-items:center;gap:6px;flex:none;font-size:12px;color:var(--muted);margin-right:8px}
.season select{font:inherit;font-weight:700;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 6px;background:#fff}
.thead{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
.thead h2{margin:0;font-size:15px;font-weight:900;display:flex;align-items:baseline;gap:10px}
.thead h2 small{font:700 12px/1 var(--num);letter-spacing:.14em;color:var(--acc)}
.rnav{margin-left:auto;display:flex;align-items:center;gap:6px}
.rnav span{font-size:14px;font-weight:900;min-width:96px;text-align:center}
.rnav button{width:32px;height:32px;border:1px solid var(--line);background:var(--card);font-size:14px;line-height:1}
.rnav button{border-radius:50%}
.rnav button:disabled{opacity:.3;cursor:default}
.trowx{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:16px;scrollbar-width:thin}
.tcard{scroll-snap-align:start;flex:none;width:300px;border:1px solid var(--line);border-radius:4px;padding:14px 16px;background:var(--card);transition:.15s}
.tcard:hover{border-color:var(--acc);box-shadow:0 4px 14px #0000000f}
.tcard .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:10px}
.st{font-weight:700;font-size:10px;padding:2px 7px;background:var(--soft);color:var(--muted)}
.st.done{background:var(--dark);color:#fff}
.tr{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;padding:5px 0;font-size:15.5px;font-weight:700}
.tr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr b{font:800 26px/1 var(--num);min-width:20px;text-align:right}
.tr.lose{color:var(--muted);font-weight:500}
.tcard .venue{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:7px;padding-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:680px){.tcard{width:250px;padding:12px 14px}.rnav span{min-width:76px;font-size:13px}}

.sec{margin-top:40px;scroll-margin-top:80px}

/* ② カレンダー */
.months{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);background:var(--card);padding:0 8px}
.months button{border:0;background:transparent;padding:10px 12px 8px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.months button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--acc)}
.days{display:flex;gap:6px;overflow-x:auto;padding:12px;scroll-snap-type:x proximity;scrollbar-width:thin;background:var(--card)}
.day{flex:none;width:62px;border:1px solid var(--line);background:var(--card);padding:8px 4px 7px;text-align:center;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:3px}
.day b{font:800 22px/1 var(--num)}
.day small{font-size:10px;color:var(--muted)}
.day .dots{display:flex;gap:2px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--k)}
.day.sun small,.day.sun b{color:#c62828}.day.sat small,.day.sat b{color:#1565c0}
.day[aria-selected=true]{background:var(--dark);border-color:var(--dark)}
.day[aria-selected=true] small,.day[aria-selected=true] b{color:#fff}
.day.today{outline:2px solid var(--hl);outline-offset:-2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:0 12px 12px;background:var(--card)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:var(--k)}
.k-TOP{--k:var(--acc)}.k-BLK{--k:#49ADE9}.k-BF{--k:#F6B93B}.k-CUP{--k:#8e6bbf}
.dh{display:flex;align-items:baseline;gap:12px;padding:14px 14px 10px;border-top:1px solid var(--line)}
.dh b{font:800 28px/1 var(--num)}
.dh span{font-size:13px;color:var(--muted);font-weight:700}
.gh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--soft);font-size:13px;font-weight:900}
.gh:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--k);flex:none}
.gh small{font-weight:500;color:var(--muted);font-size:11px}
.gh a{margin-left:auto;font-size:11.5px;color:var(--acc);white-space:nowrap}
.m{display:grid;grid-template-columns:50px minmax(0,1fr) 76px minmax(0,1fr);gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.m .ko{font:700 15px/1.1 var(--num);color:var(--muted)}
.m .t{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;min-width:0}
.m .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .t.h{flex-direction:row-reverse;text-align:right}
.m .t.lose{color:var(--muted);font-weight:500}
.m .s{font:800 22px/1 var(--num);text-align:center;background:var(--dark);color:#fff;padding:5px 0}
.m .s.vs{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:14px}
.m .s small{display:block;font:500 9.5px/1.3 "Noto Sans JP";opacity:.8}
.m .v{grid-column:2/-1;font-size:11px;color:var(--muted);margin-top:-4px}
.m:hover{background:var(--soft)}
@media(max-width:600px){.m{grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr)}.m .ko{grid-column:1/-1;font-size:12px}.m .v{grid-column:1/-1}.m .t{font-size:13px}.m .t .crest{display:none}}

/* ③ リーグのつながり */
.pyr{display:grid;gap:10px}
.lvl{display:grid;gap:10px}
.lvl.l2{max-width:640px;margin:0 auto;width:100%}
.lvl.l3{grid-template-columns:repeat(3,minmax(0,1fr))}
.arrow{display:flex;justify-content:center;gap:40px;flex-wrap:wrap;font-size:11.5px;font-weight:700;color:var(--muted)}
.arrow span:before{content:"";display:inline-block;width:0;height:0;border:6px solid transparent;margin-right:6px;vertical-align:-2px}
.arrow .u:before{border-bottom:8px solid var(--acc);border-top:0}
.arrow .d:before{border-top:8px solid #E53935;border-bottom:0}
.lg-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:8px}
.lg-h b{font-size:14px}
.lg-h a{font-size:11.5px;color:var(--acc);font-weight:700;white-space:nowrap}
.lg-h small{font-size:10.5px;color:var(--muted);font-weight:500;margin-left:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
td,th{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center}
th{font-size:10.5px;color:var(--muted);font-weight:700;background:var(--soft)}
tr:last-child td{border-bottom:0}
td.l,th.l{text-align:left}
td.rk{font:800 15px/1 var(--num);width:34px;box-shadow:inset 4px 0 0 var(--zc,transparent)}
td.pt{font:800 16px/1 var(--num)}
.tn{display:flex;align-items:center;gap:7px;font-weight:700}
.tn span{overflow:hidden;text-overflow:ellipsis;max-width:150px}
tr[data-z=up]{--zc:#43A047}tr[data-z=po]{--zc:#F6B93B}tr[data-z=dn]{--zc:#E53935}tr[data-z=hi]{--zc:#49ADE9}
.zl{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:8px 2px}
.zl i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;background:var(--zc)}
@media(max-width:820px){.lvl.l3{grid-template-columns:minmax(0,1fr)}.hide-sp{display:none}}

/* トップの写真：数枚を切り替えて表示（写真がないときは出さない） */
.photos{background:var(--dark);position:relative}
.photos[hidden]{display:none}
.ph-stage{position:relative;width:100%;height:min(56.25vw,72vh);min-height:220px;overflow:hidden}
.ph{position:absolute;inset:0;margin:0;opacity:0;transition:opacity .8s;pointer-events:none}
.ph.on{opacity:1;pointer-events:auto}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
/* 写真は切らずに全体を出す。あいたところは同じ写真をぼかして敷く */
.ph img.bg{object-fit:cover;filter:blur(24px) brightness(.6);transform:scale(1.15)}
.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:40px 20px 14px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:14px;font-weight:700;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ph figcaption small{font-size:11px;font-weight:500;opacity:.8}
.ph-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:#0007;color:#fff;font-size:22px;line-height:1;z-index:2}
.ph-nav.p{left:12px}.ph-nav.n{right:12px}
.ph-dots{position:absolute;right:14px;bottom:12px;display:flex;gap:4px;z-index:2}
.ph-dots button{width:22px;height:22px;border:0;background:transparent;padding:0;display:grid;place-items:center}
.ph-dots button:before{content:"";width:8px;height:8px;border-radius:50%;background:#ffffff80}
.ph-dots button[aria-current=true]:before{background:var(--hl);width:18px;border-radius:4px}
@media(max-width:680px){.ph-stage{height:auto;aspect-ratio:4/3;min-height:0}.ph-nav{display:none}.ph figcaption{font-size:12.5px;padding:30px 14px 36px}}
</style>
</head>
<body>
<section class="photos" id="photos" hidden aria-roledescription="carousel" aria-label="トップ写真"><div class="ph-stage" id="phStage"></div><button class="ph-nav p" id="phPrev" aria-label="前の写真">‹</button><button class="ph-nav n" id="phNext" aria-label="次の写真">›</button><div class="ph-dots" id="phDots"></div></section>
<section class="ticker"><div class="wrap">
  <div class="ctabs" id="ctabs" role="tablist"></div>
  <div class="thead"><h2><small>MATCHES</small><span id="tTitle">試合</span></h2><div class="rnav"><button id="prevR" aria-label="前の節">‹</button><span id="rLabel">–</span><button id="nextR" aria-label="次の節">›</button></div></div>
  <div class="trowx" id="tickerRow"><span class="sk"></span></div>
</div></section>
<main class="wrap">
  <section class="sec" id="calendar"><div class="h2"><h2><small>CALENDAR</small>試合カレンダー</h2><span class="note hide-sp">すべての大会の試合を日付から探せます</span></div>
    <div class="card">
      <div class="months" id="months" role="tablist"></div>
      <div class="days" id="days" role="tablist"></div>
      <div class="legend"><span class="k-TOP"><i></i>北海道リーグ</span><span class="k-BLK"><i></i>ブロックリーグ</span><span class="k-BF"><i></i>決勝大会</span><span class="k-CUP"><i></i>カップ戦・全国予選</span></div>
      <div id="dayList"></div>
    </div>
  </section>
  <section class="sec"><div class="h2"><h2><small>LEAGUE PYRAMID</small>リーグのつながり</h2><a href="./results.html">大会記録 ›</a></div><div class="pyr" id="pyr"></div></section>
</main>
<script src="./season.js?v=20261012c"></script>
<script src="./site.js?v=20261012c"></script>
<script>
chrome();
const today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const boardUrl=(c,tab)=>'./results.html?comp='+encodeURIComponent(c.id)+(tab?'&tab='+tab:'');
let C=[],ALL=[],CUR=null,ROUNDS=[],RI=0,DATES=[],SEL='';

/* ---------- ① 試合のカード（今のトップと同じカード。注目の試合はなし） ---------- */
function buildRounds(c){
  const map=new Map();
  for(const m of order(c.data.matches)){const k=m.round||'日程';if(!map.has(k))map.set(k,[]);map.get(k).push(m)}
  return [...map].map(([label,list])=>({label,list}));
}
function pickComp(code){
  CUR=C.find(c=>c.code===code)||C[0];
  ROUNDS=buildRounds(CUR);
  /* はじめに出す節：まだ終わっていない試合がある最初の節。全部終わっていれば最後の節 */
  const i=ROUNDS.findIndex(r=>r.list.some(m=>!done(m)));
  RI=i>=0?i:ROUNDS.length-1;
  $('ctabs').innerHTML=seasonSelect(SEASON,'season')+C.map(c=>'<button role="tab" data-c="'+c.code+'" aria-selected="'+(c===CUR)+'">'+esc(c.short)+'</button>').join('');
  renderTicker();
}
function stBadge(m){if(done(m))return '<span class="st done">試合終了</span>';if(m.date===today)return '<span class="st">今日</span>';return '<span class="st">'+(m.kickoff?esc(m.kickoff)+' KO':'予定')+'</span>'}
function renderTicker(){
  const r=ROUNDS[RI];
  $('rLabel').textContent=r?r.label:'–';
  $('prevR').disabled=RI<=0;$('nextR').disabled=RI>=ROUNDS.length-1;
  if(!r){$('tickerRow').innerHTML='<p class="empty">試合データがありません。</p>';return}
  $('tickerRow').innerHTML=r.list.map(m=>{const f=done(m),h=+(m.score&&m.score.home),a=+(m.score&&m.score.away);
    const lh=f&&m.winner&&m.winner!==m.home.id,la=f&&m.winner&&m.winner!==m.away.id;
    return '<a class="tcard" href="'+matchUrl(CUR.id,m)+'"><div class="meta"><span>'+esc(md(m.date)+'（'+wd(m.date)+'）')+'</span>'+stBadge(m)+'</div>'+
      '<div class="tr'+(lh?' lose':'')+'">'+crest(m.home,'sm')+'<span>'+esc(m.home.short)+'</span><b>'+(f?esc(m.score.home)+(m.score.pk?'<small style="font-size:13px"> ('+esc(m.score.pk.home)+')</small>':''):'')+'</b></div>'+
      '<div class="tr'+(la?' lose':'')+'">'+crest(m.away,'sm')+'<span>'+esc(m.away.short)+'</span><b>'+(f?esc(m.score.away)+(m.score.pk?'<small style="font-size:13px"> ('+esc(m.score.pk.away)+')</small>':''):'')+'</b></div>'+
      '<div class="venue">'+esc(m.venue||'会場未定')+'</div></a>'}).join('');
  $('tickerRow').scrollLeft=0;
}
$('ctabs').onclick=e=>{const b=e.target.closest('[data-c]');if(b)pickComp(b.dataset.c)};
$('prevR').onclick=()=>{RI--;renderTicker()};$('nextR').onclick=()=>{RI++;renderTicker()};

/* ---------- ② カレンダー ---------- */
const KC=c=>c.code==='TOP'?'TOP':/^(SD|DN|DT)$/.test(c.code)?'BLK':c.code==='BF'?'BF':'CUP';
function renderDays(){
  const mon=SEL.slice(0,7),months=[...new Set(DATES.map(d=>d.slice(0,7)))];
  $('months').innerHTML=months.map(m=>'<button role="tab" data-m="'+m+'" aria-selected="'+(m===mon)+'">'+(+m.slice(5))+'月</button>').join('');
  $('days').innerHTML=DATES.filter(d=>d.slice(0,7)===mon).map(d=>{const w=new Date(d+'T00:00:00').getDay(),ks=[...new Set(ALL.filter(m=>m.date===d).map(m=>KC(m._c)))];
    return '<button class="day'+(w===0?' sun':w===6?' sat':'')+(d===today?' today':'')+'" role="tab" data-d="'+d+'" aria-selected="'+(d===SEL)+'"><small>'+(+d.slice(5,7))+'月</small><b>'+(+d.slice(8))+'</b><small>'+WD[w]+'</small><span class="dots">'+ks.map(k=>'<i class="k-'+k+'"></i>').join('')+'</span></button>'}).join('');
  const on=$('days').querySelector('[aria-selected=true]');if(on)$('days').scrollLeft=on.offsetLeft-$('days').clientWidth/2+on.clientWidth/2;
}
function renderDay(){
  const ms=order(ALL.filter(m=>m.date===SEL));
  const groups=C.map(c=>({c,ms:ms.filter(m=>m._c===c)})).filter(g=>g.ms.length);
  $('dayList').innerHTML='<div class="dh"><b>'+esc(md(SEL))+'</b><span>（'+wd(SEL)+'）　'+ms.length+'試合</span></div>'+
    (groups.map(({c,ms})=>'<div class="gh k-'+KC(c)+'">'+esc(c.short)+'<small>'+esc(ms[0].round||'')+'</small><a href="'+boardUrl(c)+'">大会記録 ›</a></div>'+
    ms.map(m=>{const f=done(m),lh=f&&m.winner&&m.winner!==m.home.id,la=f&&m.winner&&m.winner!==m.away.id;
      return '<a class="m" href="'+matchUrl(c.id,m)+'"><span class="ko">'+esc(m.kickoff||'–')+'</span><span class="t h'+(lh?' lose':'')+'">'+crest(m.home,'sm')+'<span>'+esc(m.home.short)+'</span></span>'+
        '<span class="s'+(f?'':' vs')+'">'+(f?esc(m.score.home+'-'+m.score.away)+(m.score.pk?'<small>PK '+m.score.pk.home+'-'+m.score.pk.away+'</small>':''):'VS')+'</span><span class="t'+(la?' lose':'')+'">'+crest(m.away,'sm')+'<span>'+esc(m.away.short)+'</span></span>'+
        (m.venue?'<span class="v">📍 '+esc(m.venue)+'</span>':'')+'</a>'}).join('')).join('')||'<p class="empty">この日の試合はありません。</p>');
}
function pickDay(d){SEL=d;renderDays();renderDay()}
$('days').onclick=e=>{const b=e.target.closest('[data-d]');if(b)pickDay(b.dataset.d)};
$('months').onclick=e=>{const b=e.target.closest('[data-m]');if(b)pickDay(DATES.find(d=>d.startsWith(b.dataset.m)))};

/* ---------- ③ リーグのつながり ---------- */
const ZONE={TOP:(r,n)=>r===1?'hi':r===n?'dn':r===n-1?'po':'',DN:r=>r===1?'up':'',DT:r=>r===1?'up':'',SD:r=>r===1?'up':'',BF:r=>r<=2?'up':''};
function table(c,rows,full){
  const z=ZONE[c.code]||(()=>''),n=rows.length;
  return '<div style="overflow-x:auto"><table><tr><th>順位</th><th class="l">クラブ</th><th>勝点</th><th>試</th>'+(full?'<th class="hide-sp">勝</th><th class="hide-sp">分</th><th class="hide-sp">敗</th><th class="hide-sp">得点</th><th class="hide-sp">失点</th>':'')+'<th>得失</th></tr>'+
    rows.map(r=>{const k=z(r.rank,n);return '<tr'+(k?' data-z="'+k+'"':'')+'><td class="rk">'+r.rank+'</td><td class="l"><a class="tn" href="'+teamUrl(r.team)+'">'+crest(r.team,'xs')+'<span>'+esc(r.team.short)+'</span></a></td><td class="pt">'+r.points+'</td><td>'+r.played+'</td>'+
      (full?'<td class="hide-sp">'+r.won+'</td><td class="hide-sp">'+r.drawn+'</td><td class="hide-sp">'+r.lost+'</td><td class="hide-sp">'+r.goalsFor+'</td><td class="hide-sp">'+r.goalsAgainst+'</td>':'')+'<td>'+(r.goalDiff>0?'+':'')+r.goalDiff+'</td></tr>'}).join('')+'</table></div>';
}
function renderPyramid(){
  const by=Object.fromEntries(C.map(c=>[c.code,c]));
  const lg=(c,body,extra)=>'<div class="card"><div class="lg-h"><b>'+esc(c.short)+(extra?'<small>'+esc(extra)+'</small>':'')+'</b><a href="'+boardUrl(c,'standings')+'">順位表 ›</a></div>'+body+'</div>';
  const block=c=>{const g=c.data.groups.find(g=>/上位/.test(g.group||''))||c.data.groups[0];return lg(c,table(c,g.table.slice(0,4)),/上位/.test(g.group||'')?'上位リーグ・4位まで':'4位まで')};
  $('pyr').innerHTML=
    (by.TOP?'<div class="lvl">'+lg(by.TOP,table(by.TOP,by.TOP.data.groups[0].table,true),'1部・'+by.TOP.data.groups[0].table.length+'クラブ')+'</div>':'')+
    '<div class="arrow"><span class="u">決勝大会の上位2クラブが昇格</span><span class="d">7位は決勝大会へ・8位はブロックリーグへ降格</span></div>'+
    (by.BF?'<div class="lvl l2">'+lg(by.BF,table(by.BF,by.BF.data.groups[0].table),'各ブロック1位＋北海道リーグ7位')+'</div>':'')+
    '<div class="arrow"><span class="u">各ブロックの1位が決勝大会へ</span></div>'+
    '<div class="lvl l3">'+['SD','DN','DT'].filter(k=>by[k]).map(k=>block(by[k])).join('')+'</div>'+
    '<div class="zl"><span style="--zc:#49ADE9"><i></i>優勝</span><span style="--zc:#43A047"><i></i>上の大会へ</span><span style="--zc:#F6B93B"><i></i>決勝大会へ</span><span style="--zc:#E53935"><i></i>降格</span></div>';
}


/* ---------- トップの写真 ---------- */
async function renderPhotos(){
  const ps=(await topPhotos()).slice(0,10);if(!ps.length)return;
  $('phStage').innerHTML=ps.map((p,i)=>'<figure class="ph'+(i?'':' on')+'">'+(p.link?'<a href="'+esc(p.link)+'" target="_blank" rel="noopener">':'')+'<img class="bg" src="'+esc(p.src)+'" alt="" aria-hidden="true"'+(i?' loading="lazy"':'')+'><img src="'+esc(p.src)+'" alt="'+esc(p.caption)+'"'+(i?' loading="lazy"':'')+'>'+(p.link?'</a>':'')+
    (p.caption||p.credit?'<figcaption>'+esc(p.caption)+(p.credit?'<small>撮影：'+esc(p.credit)+'</small>':'')+'</figcaption>':'')+'</figure>').join('');
  $('phDots').innerHTML=ps.length>1?ps.map((_,i)=>'<button aria-label="'+(i+1)+'枚目" data-i="'+i+'" aria-current="'+(i===0)+'"></button>').join(''):'';
  $('phPrev').hidden=$('phNext').hidden=ps.length<2;
  $('photos').hidden=false;
  let cur=0,timer=null;
  const go=i=>{cur=(i+ps.length)%ps.length;$('phStage').querySelectorAll('.ph').forEach((f,k)=>f.classList.toggle('on',k===cur));$('phDots').querySelectorAll('button').forEach((b,k)=>b.setAttribute('aria-current',String(k===cur)))};
  const auto=()=>{clearInterval(timer);if(ps.length>1&&!matchMedia('(prefers-reduced-motion: reduce)').matches)timer=setInterval(()=>go(cur+1),6000)};
  $('phPrev').onclick=()=>{go(cur-1);auto()};$('phNext').onclick=()=>{go(cur+1);auto()};
  $('phDots').onclick=e=>{const b=e.target.closest('[data-i]');if(b){go(+b.dataset.i);auto()}};
  auto();
}
(async()=>{
  await embReady;
  renderPhotos().catch(()=>{});
  C=await loadAll();
  ALL=C.flatMap(c=>c.data.matches.filter(m=>/^\d{4}-\d{2}-\d{2}$/.test(m.date||'')).map(m=>({...m,_c:c})));
  DATES=[...new Set(ALL.map(m=>m.date))].sort();
  pickComp(QS.get('c')||'TOP');
  /* カレンダーの最初の日：今日に近い試合日（今日以前の最後の日。なければ最初の日） */
  pickDay([...DATES].reverse().find(d=>d<=today)||DATES[0]);
  renderPyramid();
})().catch(e=>{$('tickerRow').innerHTML='<p class="empty">読み込みに失敗しました：'+esc(e.message)+'</p>'});
</script>
