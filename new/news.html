<meta property="og:title" content="お知らせ | 北海道サッカーリーグ">
<meta property="og:description" content="北海道サッカーリーグからのお知らせ・大会の情報">

<style>
/* お知らせのページだけの部品（色・影・角丸は hsl.css の変数だけ。DESIGN.md） */
.demo{background:var(--card2);color:var(--logo-y);font-size:12px;font-weight:700;text-align:center;padding:8px 16px;margin-top:12px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:12px}
.crumb a{color:var(--logo-b)}
.crumb a:hover{text-decoration:underline}
main.main{padding-top:24px}
.card{overflow:hidden}
.chips{margin-bottom:12px}
.cat{display:inline-block;font-size:12px;font-weight:700;line-height:1.5;color:var(--logo-b);border:1px solid var(--line);padding:0 8px;border-radius:var(--r-pill);white-space:nowrap}
a.cat{position:relative}
a.cat:after{content:"";position:absolute;inset:-12px -4px}  /* 押せる範囲を 44px に広げる */
a.cat:hover{border-color:var(--logo-b)}
.imp{display:inline-block;font-size:12px;font-weight:700;line-height:1.5;color:#fff;background:var(--red-bg);padding:0 8px;border-radius:var(--r-pill);white-space:nowrap}
.newb{display:inline-block;font-size:12px;font-weight:700;line-height:1.5;color:var(--navy);background:var(--logo-y);padding:0 8px;border-radius:var(--r-pill);white-space:nowrap}

.list a{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:center;padding:16px;border-top:1px solid var(--line)}
.list a:first-child{border-top:0}
.list a:hover{background:var(--card2)}
.list a:hover .t b{color:var(--logo-b)}
.list time{font:600 16px/1.3 var(--num);color:var(--muted)}
.list .t{min-width:0}
.list .t .tags{display:flex;flex-wrap:wrap;gap:4px}
.list .t b{display:block;font-size:16px;line-height:1.55;margin-top:4px}
.list .go{color:var(--muted);font-size:20px}
.list a.th{grid-template-columns:120px 1fr 128px auto}
.list .thumb{width:128px;aspect-ratio:3/2;border-radius:var(--r-sm);overflow:hidden;background:var(--card2)}
.list .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.more{display:flex;margin:12px auto 0}
.aphoto{margin:0 0 24px;border-radius:var(--r-sm);overflow:hidden;background:var(--card2)}
.aphoto img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;background:var(--card2)}
.article{padding:32px}
.article .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.article .meta time{font:600 18px/1.3 var(--num);margin-right:4px}
.article h2{font-size:24px;line-height:1.5;margin:12px 0 16px;font-weight:900}
.article .body{font-size:16px;line-height:1.7;border-top:1px solid var(--line);padding-top:16px;overflow-wrap:anywhere}
.article .body a{color:var(--logo-b);text-decoration:underline;word-break:break-all}
.article .btn{margin-top:24px}
.back{display:inline-flex;align-items:center;min-height:44px;margin-top:16px;font-size:14px;color:var(--logo-b);font-weight:700}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:600px){
  main.main{padding-top:16px}
  .chips button{min-height:44px}
  .list a{grid-template-columns:1fr;gap:4px;padding:12px 16px}
  .list .go{display:none}
  .list a.th{grid-template-columns:1fr 96px;column-gap:12px}
  .list a.th time{grid-column:1}
  .list a.th .t{grid-column:1}
  .list a.th .thumb{grid-column:2;grid-row:1/span 2;width:96px;align-self:center}
  .article{padding:16px}
  .article h2{font-size:20px}
  .article .btn{width:100%}
}
</style>
</head>
<body>
<script src="./hdr.js?v=20261021"></script>
<script>hslChrome('./news.html')</script>
<div class="demo" id="demo" hidden>プレビュー用のサンプルデータを表示しています（公開環境では公式データに自動で切り替わります）</div>
<section class="phead"><div class="wrap">
  <div class="crumb"><a href="./">ホーム</a> ／ <span id="crumb">お知らせ</span></div>
  <div class="eyebrow">NEWS</div><h1 id="h1">お知らせ</h1>
</div></section>
<main class="wrap main" id="main"><span class="sk"></span><span class="sk"></span></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has=v=>v!=null&&String(v).trim()!=='';
const PARAMS=new URLSearchParams(location.search);
let DEMO=PARAMS.has('demo');
const WD=['日','月','火','水','木','金','土'];
function fmtDate(s){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');if(!m)return s||'';return m[1]+'.'+m[2]+'.'+m[3]+'（'+WD[new Date(+m[1],+m[2]-1,+m[3]).getDay()]+'）'}
const safeUrl=u=>/^https?:\/\//i.test(String(u||''))?String(u):'';
/* 写真：ドライブの共有リンクは縮小版（幅 w px）にする。https の画像URLはそのまま */
function photoUrl(u,w){
  u=String(u||'').trim();if(!u)return '';
  const d=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/);
  if(d)return 'https://drive.google.com/thumbnail?id='+d[1]+'&sz=w'+w;
  if(/^https:\/\//i.test(u))return u;
  if(DEMO&&/^data:image\//.test(u))return u;
  return '';
}
const photoSet=(u,ws)=>/drive\.google\.com\/thumbnail/.test(photoUrl(u,ws[0]))?ws.map(w=>photoUrl(u,w)+' '+w+'w').join(', '):'';
const noImg="this.closest('.thumb,.aphoto').remove()";
/* 本文：改行を保ち、URLをリンクにする */
function richText(t){return esc(t).replace(/(https?:\/\/[^\s<>"']+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>')}
const shortComp=n=>String(n||'').replace(/^\d{4}年度\s*/,'').replace(/第\d+回\s*/g,'').replace(/^北海道サッカーリーグ$/,'北海道リーグ').replace(/^北海道サッカーリーグ\s*(?=\S)/,'').replace(/ブロックリーグ決勝大会/,'決勝大会').replace(/ブロックリーグ$/,'ブロック').replace(/^(全国社会人|全国クラブ).*$/,'$1予選').replace(/^北海道サッカー選手権.*$/,'北海道選手権').trim()||n;
async function getJSON(file){
  if(DEMO)return demoData(file);
  const r=await fetch('../results/data/'+file,{cache:'no-store'});
  if(!r.ok)throw Error('HTTP '+r.status);
  return r.json();
}
async function boot(file,fn){
  let d;
  try{d=await getJSON(file)}
  catch(e){
    if(!/github\.io$/.test(location.hostname)){DEMO=true;d=await getJSON(file)}
    else{fn(null,e);return}
  }
  $('demo').hidden=!DEMO;
  if(d?.updatedAt){/* フッター（hdr.js）はページを読み終えてから入るので、まだなければ待つ */
    const put=()=>{const u=$('updated');if(u)u.textContent='最終更新 '+String(d.updatedAt).replace('T',' ').slice(0,16)};
    if($('updated'))put();else document.addEventListener('DOMContentLoaded',put);}
  fn(d);
}

/* 7日以内のお知らせに NEW を付ける（トップと同じ） */
const fresh=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');if(!m)return false;const t=new Date();t.setHours(0,0,0,0);const age=(t-new Date(+m[1],+m[2]-1,+m[3]))/864e5;return age>=0&&age<=7};
let ALL=[],CAT=PARAMS.get('cat')||'ALL',SHOW=20;
function renderList(){
  const cats=[];for(const n of ALL)if(!cats.some(c=>c[0]===n.cat))cats.push([n.cat,n.catName]);
  cats.sort((a,b)=>(a[0]==='連盟'?-1:b[0]==='連盟'?1:0));
  if(CAT!=='ALL'&&!cats.some(c=>c[0]===CAT))CAT='ALL';
  const list=ALL.filter(n=>CAT==='ALL'||n.cat===CAT);
  $('main').innerHTML='<div class="pills chips" role="tablist">'+[['ALL','すべて'],...cats].map(([k,l])=>'<button role="tab" data-cat="'+esc(k)+'" aria-selected="'+(k===CAT)+'">'+esc(k==='ALL'||k==='連盟'?l:shortComp(l))+'</button>').join('')+'</div>'+
    '<div class="card list">'+(list.length?list.slice(0,SHOW).map(n=>{const ph=photoUrl(n.photo,400);return '<a href="?id='+encodeURIComponent(n.id)+'"'+(ph?' class="th"':'')+'><time>'+esc(fmtDate(n.date))+'</time><div class="t">'+'<span class="tags">'+(n.important?'<span class="imp">重要</span>':'')+(fresh(n.date)?'<span class="newb">NEW</span>':'')+'<span class="cat">'+esc(n.cat==='連盟'?'連盟':shortComp(n.catName))+'</span></span><b>'+esc(n.title)+'</b></div>'+(ph?'<span class="thumb"><img src="'+esc(ph)+'" alt="" loading="lazy" decoding="async" onerror="'+noImg+'"></span>':'')+'<span class="go">›</span></a>'}).join(''):'<p class="empty">お知らせはまだありません。</p>')+'</div>'+
    (list.length>SHOW?'<button class="btn more" id="more">もっと見る（残り'+(list.length-SHOW)+'件）</button>':'');
}
function renderArticle(n){
  document.title=n.title+' | 北海道サッカーリーグ';
  $('crumb').innerHTML='<a href="./news.html">お知らせ</a> ／ 記事';
  $('h1').textContent='お知らせ';
  const u=safeUrl(n.url);
  $('main').innerHTML='<article class="card article"><div class="meta"><time>'+esc(fmtDate(n.date))+'</time>'+(n.important?'<span class="imp">重要</span>':'')+'<a class="cat" href="./news.html?cat='+encodeURIComponent(n.cat)+'">'+esc(n.cat==='連盟'?'連盟':shortComp(n.catName))+'</a></div>'+
    '<h2>'+esc(n.title)+'</h2>'+(photoUrl(n.photo,1200)?'<figure class="aphoto"><img src="'+esc(photoUrl(n.photo,1200))+'"'+(photoSet(n.photo,[800,1200,1600])?' srcset="'+esc(photoSet(n.photo,[800,1200,1600]))+'" sizes="(max-width:1100px) 100vw, 1036px"':'')+' alt="'+esc(n.title)+'" decoding="async" onerror="'+noImg+'"></figure>':'')+(has(n.body)?'<div class="body">'+richText(n.body)+'</div>':'')+
    (u?'<a class="btn main" href="'+esc(u)+'" target="_blank" rel="noopener">'+(/\.pdf(\?|$)/i.test(u)?'PDFを開く':'詳しく見る')+' ↗</a>':'')+
    '</article><a class="back" href="./news.html">‹ お知らせ一覧へ</a>';
}
$('main').addEventListener('click',e=>{
  const b=e.target.closest('.chips button');if(b){CAT=b.dataset.cat;SHOW=20;const u=new URL(location.href);if(CAT==='ALL')u.searchParams.delete('cat');else u.searchParams.set('cat',CAT);history.replaceState(null,'',u);renderList();return}
  if(e.target.id==='more'){SHOW+=20;renderList()}
});
boot('news.json',(d,err)=>{
  if(!d){$('main').innerHTML='<p class="empty">お知らせを読み込めませんでした。</p>';return}
  ALL=d.news||[];
  const id=PARAMS.get('id');
  if(id){const n=ALL.find(x=>x.id===id);if(n){renderArticle(n);return}}
  renderList();
});

function demoData(file){
  const t=new Date();const d=n=>{const x=new Date(t);x.setDate(x.getDate()-n);return x.toISOString().slice(0,10)};
  return {ok:true,updatedAt:d(0)+'T18:00:00+09:00',news:[
    {id:'a1',date:d(1),cat:'連盟',catName:'連盟',photo:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800"><rect width="1200" height="800" fill="#1d3350"/><text x="600" y="420" font-size="60" font-family="sans-serif" fill="#fff" text-anchor="middle">サンプル写真</text></svg>'),title:'（サンプル）2027年度 チーム登録の受付について',body:'（サンプル）ここに本文が入ります。\n改行もそのまま表示されます。\n詳しくは https://example.com をご覧ください。',url:'https://example.com',important:true},
    {id:'a2',date:d(3),cat:'demo-1',catName:'【サンプル】リーグ 1部',title:'（サンプル）第12節 会場変更のお知らせ',body:'（サンプル）第12節の会場を変更します。',url:'',important:true},
    {id:'a3',date:d(6),cat:'demo-cup',catName:'【サンプル】新人戦',title:'（サンプル）新人戦 組み合わせ決定',body:'',url:'https://example.com/a.pdf',important:false},
    {id:'a4',date:d(12),cat:'連盟',catName:'連盟',title:'（サンプル）審判講習会の開催',body:'（サンプル）本文',url:'',important:false}]};
}
</script>
<script src="./alert.js?v=20261020"></script>
<script src="./hit.js?v=20261020"></script>
</body>
</html>
