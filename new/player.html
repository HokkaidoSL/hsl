<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08121d">
<link rel="icon" href="./img/hsl-logo.svg" type="image/svg+xml">
<title>選手 | 北海道サッカーリーグ</title>
<meta name="robots" content="noindex, nofollow">
<!--
  new/results.html 大会記録（2026-10 旧「公式記録ページ」results/index.html から移した）
  データは全体システムが書き出す ../results/data/*.json（StaticSite.gs）
  ?comp=2027-TOP で大会、&tab=standings でタブ、&match=試合ID で試合詳細を開ける
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./hsl.css?v=20261021">
<style>
/* 選手のページだけの部品（色・影・角丸は hsl.css の変数だけ） */
.main{padding-bottom:16px;min-height:50vh}
.card{overflow:hidden}
.loading{padding:48px 0;text-align:center;color:var(--muted)}
.empty{text-align:center}
.back{display:inline-flex;align-items:center;min-height:44px;margin-top:16px;color:var(--logo-b);font-size:14px;font-weight:700}
.back:hover{text-decoration:underline}
.sh{display:flex;align-items:baseline;gap:12px;margin:32px 0 12px}
.sh h2{margin:0;font-size:24px;font-weight:900;line-height:1.3}
.sh h2 small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:2px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* エンブレム（暗い地の上：白い版か、白い丸い台） */
.crest{position:relative;padding:0;background:var(--c,var(--draw))}
.crest .bdg{position:absolute;right:-6px;bottom:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:var(--r-pill);background:var(--logo-y);color:var(--navy);font:800 12px/18px var(--num);font-style:normal;text-align:center;white-space:nowrap}
.crest.xs{width:24px;height:24px;font-size:12px;padding:0;letter-spacing:-.05em}
.crest.xs .bdg{display:none}
.crest.xl{width:96px;height:96px;font-size:30px}
.crest.img{padding:0}
.crest.img img{width:100%;height:100%;object-fit:contain;display:block}
.crest.img .ed{display:none}
.crest.img.hasdark{background:transparent;border-radius:0;overflow:visible}
.crest.img.hasdark .el{display:none}
.crest.img.hasdark .ed{display:block}
.crest.img:not(.hasdark){background:#fff;border-radius:50%}
.crest.img:not(.hasdark) img{position:absolute;inset:15%;width:70%;height:70%}

/* 選手の見出し */
.ph{display:flex;gap:24px;align-items:center;padding:24px;margin-top:8px}
.pimg{width:112px;height:112px;border-radius:50%;object-fit:cover;flex:none;background:var(--card2)}
.pimg.none{display:flex;align-items:center;justify-content:center}
.pinfo{min-width:0}
.pinfo h1{margin:4px 0 2px;font-size:32px;font-weight:900;line-height:1.3}
.pteam a{display:inline-flex;align-items:center;gap:8px;min-height:32px;color:var(--logo-b);font-weight:700;font-size:14px}
.kana{color:var(--muted);font-size:13px}
.pmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pmeta span{background:var(--card2);color:var(--ink);border-radius:var(--r-pill);padding:2px 12px;font-size:13px;font-weight:700}

/* 通算（大きな数字） */
.ctot{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ctot .card{padding:16px 8px;text-align:center}
.ctot b{display:block;font-family:var(--num);font-size:32px;font-weight:800;line-height:1.1}
.ctot span{font-size:12px;color:var(--muted);font-weight:700}

/* 成績の表 */
.tbl td a{color:var(--logo-b)}
.tbl td a:hover{text-decoration:underline}
.pst td.l:nth-child(2){white-space:normal;min-width:110px}
.pst td.b{font-family:var(--num);font-size:16px;font-weight:700}
.pst tr.sum td{background:var(--card2);font-weight:900;border-top:2px solid var(--line)}
.pst .tn{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.plog .res{width:24px;height:24px;vertical-align:middle;margin-right:6px;display:inline-grid}
.plog .sco{font-family:var(--num);font-size:16px;font-weight:700}
.plog td.ev{white-space:nowrap}
.plog .yc,.plog .rc{display:inline-block;width:10px;height:14px;border-radius:2px;vertical-align:-2px;background:var(--logo-y)}
.plog .rc{background:var(--red-bg)}
@media(max-width:600px){
  .ph{flex-direction:column;text-align:center;padding:16px}
  .pmeta{justify-content:center}
  .pinfo h1{font-size:24px}
  .sh h2{font-size:20px}
  .ctot{grid-template-columns:repeat(2,1fr)}
  .pst:not(.hist) .tn .tx{display:none}
  .pst td,.pst th{padding-left:6px;padding-right:6px}
}
</style>
</head>

<script src="./hdr.js?v=20261021"></script>
<script>hslChrome('')</script>

<main class="wrap main" id="main"><div class="loading">読み込み中…</div></main>


<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* カレンダーに入れる：../results/data/cal/*.ics（全体システムが書き出す）。ファイルがあるときだけ出す */
function calBox(el,choices,title){
  if(!el||!choices.length)return;
  const url=f=>new URL('../results/data/cal/'+f,location.href).href;
  fetch(url(choices[0].file),{method:'HEAD',cache:'no-store'}).then(r=>{if(!r.ok)return;
    el.innerHTML='<span class="cl">📅 '+esc(title)+'</span>'+(choices.length>1?'<select class="calsel" aria-label="カレンダーに入れる日程">'+choices.map((c,i)=>'<option value="'+i+'">'+esc(c.label)+'</option>').join('')+'</select>':'<span class="calone">'+esc(choices[0].label)+'</span>')+
      '<a class="cal-ios" href="#">iPhone・Mac</a><a class="cal-g" href="#" target="_blank" rel="noopener">Googleカレンダー</a><small>登録すると、日程や会場が変わったときもカレンダーが自動で変わります（反映まで数時間かかることがあります）</small>';
    const set=i=>{const w=url(choices[i].file).replace(/^https?:/,'webcal:');el.querySelector('.cal-ios').href=w;el.querySelector('.cal-g').href='https://calendar.google.com/calendar/r?cid='+encodeURIComponent(w);};
    const sel=el.querySelector('.calsel');if(sel)sel.onchange=()=>set(+sel.value);
    set(0);el.hidden=false;}).catch(()=>{});
}
const has=v=>v!=null&&String(v).trim()!=='';
const name=t=>typeof t==='string'?t:(t?.short||t?.name||'未定');
const tkey=t=>typeof t==='string'?t:(t?.id||t?.name||t?.short||'');
const shortComp=n=>String(n||'').replace(/^\d{4}年度\s*/,'').replace(/第\d+回\s*/,'').replace(/^北海道/,'').trim()||n;
const W='日月火水木金土';
const jd=ymd=>{const m=String(ymd||'').match(/(\d{4})-(\d{2})-(\d{2})/);if(!m)return ymd||'日程未定';const d=new Date(+m[1],+m[2]-1,+m[3]);return `${+m[2]}月${+m[3]}日（${W[d.getDay()]}）`;};
const sd=ymd=>{const m=String(ymd||'').match(/(\d{4})-(\d{2})-(\d{2})/);if(!m)return '';const d=new Date(+m[1],+m[2]-1,+m[3]);return `${+m[2]}/${+m[3]}(${W[d.getDay()]})`;};

/* ---------- データ（全体システムが書き出した JSON。同じファイルは1回だけ読む） ---------- */
const JC={};
const getJSON=f=>JC[f]||(JC[f]=fetch('../results/data/'+f,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('データを読み込めませんでした（'+r.status+'）');return r.json();}).catch(e=>{delete JC[f];throw e;}));

/* ---------- エンブレム・チームカラー（チームページと同じ考え方） ---------- */
const PALETTE=['#145ec9','#0f7a6b','#7b3fb5','#c0392b','#1d6fa5','#b35c00','#2e7d32','#ad1457','#37474f','#5d4dbf'];
const PROF=new Map();
let EMB={};
const embReady=fetch('./emblems/index.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).then(j=>{EMB=j&&typeof j==='object'?j:{}}).catch(()=>{});
function embFor(...ns){for(const n of ns){const f=n&&EMB[String(n).trim()];if(f&&/^[^\/\\?#]+\.(png|jpe?g|webp|svg|gif)$/i.test(f))return './emblems/'+encodeURIComponent(f)}return ''}
function emblemUrl(e){
  e=String(e||'').trim();if(!e)return '';
  const d=e.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/);
  if(d)return 'https://drive.google.com/thumbnail?id='+d[1]+'&sz=w400';
  if(/^https:\/\//i.test(e))return e;
  if(/^[^\/\\?#]+\.(png|jpe?g|webp|svg|gif)$/i.test(e))return './emblems/'+encodeURIComponent(e);
  return '';
}
const profOf=t=>t&&(PROF.get(tkey(t))||PROF.get(t.univ||''))||null;
function teamColor(t){const p=profOf(t);if(p&&/^#[0-9a-f]{3,8}$/i.test(p.color||''))return p.color;let h=0;for(const ch of String(tkey(t)))h=(h*31+ch.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]}
function crestInk(c){const m=/^#?([0-9a-f]{6})$/i.exec(String(c||''));if(!m)return '#fff';const n=parseInt(m[1],16),L=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*L[0]+.7152*L[1]+.0722*L[2]>.45?'var(--navy)':'#fff'}
function crestBase(t,size){
  if(!t)return '';
  const n=name(t);let s=n.replace(/^(北海道|国立|私立)/,'');
  const ch=[...s].slice(0,2).join('')||'?',two=[...ch].length>1,p=profOf(t),c=teamColor(t);
  const u=emblemUrl(p?.emblem)||embFor(t.univ,t.name,t.short),ud=emblemUrl(p?.emblemDark);
  const st='style="--c:'+c+';color:'+crestInk(c)+'"';
  if(u)return '<span class="crest img '+(size||'')+(two?' two':'')+(ud?' hasdark':'')+'" '+st+' data-ch="'+esc(ch)+'"><img class="el" src="'+esc(u)+'" alt="" loading="lazy" onerror="crestFail(this)">'+(ud?'<img class="ed" src="'+esc(ud)+'" alt="" loading="lazy" onerror="crestFail(this)">':'')+'</span>';
  return '<span class="crest '+(size||'')+(two?' two':'')+'" '+st+' aria-hidden="true">'+esc(ch)+'</span>';
}
function crestFail(img){const s=img.parentNode;if(img.classList.contains('ed')){s.classList.remove('hasdark');img.remove();return}s.classList.remove('img','hasdark');s.querySelectorAll('img').forEach(x=>x.remove());s.insertBefore(document.createTextNode(s.dataset.ch),s.firstChild)}
/* 同じ見た目のエンブレムが並ぶときだけ、名前の違う部分を小さな札にする（チームページと同じ） */
const BADGE=new Map();
const BADGE_WORDS={'セカンド':'2nd','サテライト':'SAT','サード':'3rd','トップ':'TOP'};
function makeBadges(teams){
  BADGE.clear();const g=new Map();
  for(const t of teams){const h=crestBase(t),u=(h.match(/<img[^>]*? src="([^"]+)"/)||[])[1];const look=u||'txt:'+((h.match(/>([^<]*)<\/span>$/)||[])[1]||'');if(!g.has(look))g.set(look,[]);g.get(look).push(t);}
  const tok=c=>/[0-9A-Za-z\-－]/.test(c||'');
  for(const ts of g.values()){
    if(ts.length<2)continue;
    const ns=ts.map(t=>[...String(t.short||t.name||'')]),min=Math.min(...ns.map(n=>n.length));
    let p=0;while(p<min&&ns.every(n=>n[p]===ns[0][p]))p++;
    while(p>0&&tok(ns[0][p-1])&&ns.some(n=>tok(n[p])))p--;
    let s=0;while(s<min-p&&ns.every(n=>n[n.length-1-s]===ns[0][ns[0].length-1-s]))s++;
    while(s>0&&ns.some(n=>tok(n[n.length-1-s]))&&tok(ns[0][ns[0].length-s]))s--;
    let out=ns.map(n=>{let x=n.slice(p,n.length-s).join('').replace(/[-－\s]/g,'');x=BADGE_WORDS[x]||x;return [...x].slice(0,3).join('')});
    if(out.some(x=>!x)||new Set(out).size<out.length)out=ts.map((_,i)=>String.fromCharCode(65+i));
    ts.forEach((t,i)=>BADGE.set(tkey(t),out[i]));
  }
}
function crest(t,size){const h=crestBase(t,size),b=t&&BADGE.get(tkey(t));return b?h.replace(/<\/span>$/,'<i class="bdg">'+esc(b)+'</i></span>'):h}
const teamUrl=t=>'./team.html?comp='+encodeURIComponent(S.comp)+'&team='+encodeURIComponent(tkey(t));
const teamLink=(t,label)=>t&&t.id?'<a href="'+teamUrl(t)+'">'+esc(label||name(t))+'</a>':esc(label||name(t));

/* ---------- 選手のページ ----------
   ?team=チームID&name=氏名（&comp=大会ID）。同じクラブの、すべての公開中の大会の記録を名前で集める
   （試合報告と公式記録で選手IDが違うことがあるため、名前で合わせる）。
   名鑑で「掲載しない」の選手は、写真・出身校などを出さず、公式記録の成績だけを出す */
const QS=new URLSearchParams(location.search);
const P={team:QS.get('team')||'',name:QS.get('name')||'',comp:QS.get('comp')||''};
const S={comp:P.comp};
const nrm=v=>String(v||'').replace(/[\s　]/g,'');
function showErr(e){$('main').innerHTML='<div class="card empty">読み込めませんでした。<br><small>'+esc(e&&e.message||e)+'</small></div>';}
/* 同じ名前（空白・字体をそろえたもの）は同じ選手として、クラブ・年度をまたいで集める（移籍した選手もいるため）。
   書き方のちがい（髙/高 など）は ../results/data/player-aliases.json の aliases で1つの名前にまとめる */
let ALIAS={};
const SEP=new Set();  // 同じ名前でも別の人（player-aliases.json の separate）。見ているクラブの記録だけを数える
const canon=n=>{const k=nrm(n);return ALIAS[k]||k};
const CSHORT={TOP:'北海道リーグ',SD:'札幌・道央ブロック',DN:'道南ブロック',DT:'道東・道北ブロック',BF:'ブロックリーグ決勝大会',SC:'全国社会人 北海道予選',CC:'全国クラブ 北海道予選',HC:'北海道サッカー選手権'};
const compLabel=c=>CSHORT[String(c.id).split('-').pop()]||shortComp(c.name);
const yearOf=c=>Number(c.year||String(c.id).slice(0,4));
async function init(){
  try{
    await embReady;
    if(!P.team||!P.name)throw new Error('選手が指定されていません');
    try{const a=await getJSON('player-aliases.json');for(const [k,v] of Object.entries(a.aliases||{}))ALIAS[nrm(k)]=nrm(v);
      for(const n of (a.separate&&a.separate.names)||[])SEP.add(canon(n));}catch(e){}
    const cl=await getJSON('competitions.json');
    const comps=cl.competitions||[];
    const all=(await Promise.all(comps.map(c=>getJSON(encodeURIComponent(c.id)+'.json').then(d=>({c,d})).catch(()=>null)))).filter(Boolean);
    // この選手のチーム（クラブ）
    let me=null;
    for(const x of all){for(const m of x.d.matches||[])for(const t of [m.home,m.away])if(t&&t.id===P.team)me=t;if(me)break;}
    if(!me)throw new Error('チームが見つかりません');
    const key=canon(P.name);
    const rows=[];
    for(const x of all){
      const d=x.d;
      for(const st of d.playerStats||[]){
        // 同じ年度に背番号が2つある選手（背番号ごとに別の行になっている）は足し合わせる
        const ps=(st.players||[]).filter(p=>canon(p.name)===key);
        if(!ps.length)continue;
        const p=ps.length===1?ps[0]:ps.reduce((a,b)=>{const o={...a,no:a.no+'・'+b.no,log:{...(a.log||{}),...(b.log||{})}};
          for(const k of ['apps','starts','min','goals','assists','yc','rc'])o[k]=(Number(a[k])||0)+(Number(b[k])||0);return o;});
        rows.push({comp:x.c,data:d,team:st.team,p,games:st.games||[]});
      }
      // 出場記録のない大会（結果だけ）は、得点・警告から
      if(!rows.some(r=>r.comp.id===x.c.id)){
        const sc=(d.scorers||[]).find(r=>canon(r.name)===key);
        const as=(d.assists||[]).find(r=>canon(r.name)===key);
        const ct=(d.cardTable||[]).map(t=>({t,p:(t.players||[]).find(p=>canon(p.name)===key)})).find(z=>z.p);
        if(sc||as||ct)rows.push({comp:x.c,data:d,team:(sc||as||{}).team||ct.t.team,p:{name:P.name,goals:sc?sc.count:0,assists:as?as.count:0,yc:ct?ct.p.c||0:0,rc:ct?ct.p.s||0:0},games:[]});
      }
    }
    const sameU=t=>t&&(t.univ||t.name)===(me.univ||me.name);
    if(SEP.has(key))for(let i=rows.length-1;i>=0;i--)if(!sameU(rows[i].team))rows.splice(i,1);
    rows.sort((a,b)=>yearOf(b.comp)-yearOf(a.comp)||comps.indexOf(a.comp)-comps.indexOf(b.comp));
    // 名鑑（掲載してよい選手だけ。写真は本人の同意があるものだけが入っている）。いま見ているクラブの名鑑から
    let prof=null;
    for(const r of rows.filter(r=>sameU(r.team)).concat(P.comp?[{comp:{id:P.comp}}]:[])){
      try{const ro=await getJSON(encodeURIComponent(r.comp.id)+'-roster.json');
        for(const t of ro.teams||[]){if(!sameU(t.team))continue;if(t.profile&&!PROF.has(tkey(t.team)))PROF.set(tkey(t.team),t.profile);
          const f=(t.players||[]).find(p=>canon(p.name)===key);if(f&&!prof)prof=f;}
      }catch(e){}
      if(prof)break;
    }
    render(me,rows,prof);
  }catch(e){showErr(e)}
}
function render(me,rows,prof){
  document.title=P.name+'（'+(me.univ||me.name)+'） | 北海道サッカーリーグ';
  // 試合報告から取り込んだ試合は、出場の数に入っていないことがあるので、試合ごとの記録からも数える
  rows.forEach(r=>{const L=Object.values(r.p.log||{});if(!L.length)return;r.p.apps=Math.max(Number(r.p.apps)||0,L.length);r.p.starts=Math.max(Number(r.p.starts)||0,L.filter(l=>l.st).length);
    const mm=L.filter(l=>l.min!=null);if(!mm.length&&!r.p.min)r.p.min=null;});
  const tot=(rs,k)=>rs.reduce((a,r)=>a+(Number(r.p[k])||0),0);
  const latest=rows.length?yearOf(rows[0].comp):null;
  const cur=rows.filter(r=>yearOf(r.comp)===latest);
  const years=[...new Set(rows.map(r=>yearOf(r.comp)))];
  const clubs=[...new Map(rows.map(r=>[r.team.univ||r.team.name,r.team])).values()];
  const photo=prof&&prof.photo?photoSrc(prof.photo,400):'';
  const head='<div class="ph card">'+(photo?'<img class="pimg" src="'+esc(photo)+'" alt="" onerror="this.remove()">':'<div class="pimg none">'+crest(me,'xl')+'</div>')+
    '<div class="pinfo"><div class="pteam"><a href="'+teamUrlP(me)+'">'+crest(me,'xs')+esc(me.univ||me.name)+'</a></div><h1>'+esc(P.name)+'</h1>'+(prof&&prof.kana?'<div class="kana">'+esc(prof.kana)+'</div>':'')+
    '<div class="pmeta">'+[prof&&prof.no?'背番号 '+esc(prof.no):'',prof&&prof.pos?esc(prof.pos):'',prof&&prof.grade?esc(prof.grade)+'年':'',prof&&prof.school?esc(prof.school):''].filter(Boolean).map(x=>'<span>'+x+'</span>').join('')+'</div></div></div>';
  // 表の列（出場の記録がある大会があれば 出場・先発・時間 も）
  const hasApps=rows.some(r=>r.p.apps!=null),hasMin=rows.some(r=>r.p.min);
  const cols=[['出場','apps'],['得点','goals']].concat(hasApps&&(tot(rows,'starts')||hasMin)?[['先発','starts']]:[],hasMin?[['時間','min']]:[],rows.some(r=>r.p.assists)?[['アシスト','assists']]:[],[['警告','yc'],['退場','rc']]);
  const cell=(r,k)=>{const v=r.p[k];if(k==='min')return v?v+'分':'–';if((k==='apps'||k==='starts')&&v==null)return '–';return v||0;};
  const sumRow=(label,rs)=>'<tr class="sum"><td class="l" colspan="3">'+label+'</td>'+cols.map(c=>'<td class="b">'+(c[1]==='min'?tot(rs,'min')+'分':tot(rs,c[1]))+'</td>').join('')+'</tr>';
  const line=r=>'<tr><td class="l">'+yearOf(r.comp)+'</td><td class="l"><a href="./results.html?comp='+encodeURIComponent(r.comp.id)+'">'+esc(compLabel(r.comp))+'</a></td><td class="l"><span class="tn">'+crest(r.team,'xs')+'<span class="tx">'+esc(r.team.short||r.team.name)+'</span></span></td>'+cols.map(c=>'<td'+(c[1]==='apps'||c[1]==='goals'?' class="b"':'')+'>'+cell(r,c[1])+'</td>').join('')+'</tr>';
  const thead='<tr><th class="l">年度</th><th class="l">大会</th><th class="l">チーム</th>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr>';
  // 通算（数字の大きいカード）
  const big=[['シーズン',years.length],['出場',hasApps?tot(rows,'apps'):'–'],['得点',tot(rows,'goals')],['警告',tot(rows,'yc')]];
  const career=rows.length?'<div class="sh"><h2>通算成績<small>'+(years.length>1?Math.min(...years)+'〜'+Math.max(...years)+'年度':years[0]+'年度')+(clubs.length>1?'・'+clubs.length+'クラブ':'')+'</small></h2></div>'+
    '<div class="ctot">'+big.map(([l,v])=>'<div class="card"><b>'+v+'</b><span>'+l+'</span></div>').join('')+'</div>':'';
  const now=cur.length?'<div class="sh"><h2>'+latest+'年度の成績</h2></div><div class="card scroll"><table class="tbl pst">'+thead+cur.map(line).join('')+(cur.length>1?sumRow(latest+'年度 合計',cur):'')+'</table></div>':'';
  const hist=rows.length?'<div class="sh"><h2>シーズンごとの成績</h2></div><div class="card scroll"><table class="tbl pst hist">'+thead+rows.map(line).join('')+sumRow('通算',rows)+'</table></div>':'';
  const logs=cur.filter(r=>r.p.log&&Object.keys(r.p.log).length).map(r=>{
    const g=new Map(r.games.map(x=>[x.id,x]));
    const ids=Object.keys(r.p.log).sort((a,b)=>String((g.get(a)||{}).date||'').localeCompare(String((g.get(b)||{}).date||'')));
    return '<div class="sh"><h2>試合ごと<small>'+latest+'年度 '+esc(compLabel(r.comp))+'</small></h2></div><div class="card scroll"><table class="tbl plog" data-comp="'+esc(r.comp.id)+'"><tr><th class="l">日付</th><th class="l">節</th><th class="l">相手</th><th>結果</th><th>出場</th><th>時間</th><th class="l">記録</th></tr>'+
      ids.map(id=>{const x=g.get(id)||{},l=r.p.log[id];const res=x.gf!=null?(x.gf>x.ga?'<span class="res w">勝</span>':x.gf<x.ga?'<span class="res l">負</span>':'<span class="res d">分</span>')+'<span class="sco">'+esc(x.gf)+'-'+esc(x.ga)+'</span>':'';
        return '<tr data-mid="'+esc(id)+'"><td class="l">'+esc(sd(x.date))+'</td><td class="l">'+esc(x.round||'')+'</td><td class="l">'+(x.h?'':'@')+esc(x.opp||'')+'</td><td><a href="./results.html?comp='+encodeURIComponent(r.comp.id)+'&match='+encodeURIComponent(id)+'">'+(res||'詳細')+'</a></td><td>'+(l.st?'先発':(l.min!=null?'途中':'出場'))+'</td><td>'+(l.min!=null?l.min+'分':'')+'</td><td class="l ev"></td></tr>';}).join('')+'</table></div>';
  }).join('');
  $('main').innerHTML='<a class="back" href="'+teamUrlP(me)+'">‹ '+esc(me.univ||me.name)+'のページへ</a>'+head+career+now+logs+hist+
    (rows.length?'':'<div class="card empty">公式記録はまだありません</div>')+
    '<p class="note">成績は、連盟の公式記録（2019年度からの北海道サッカーリーグなど）から自動で出しています。同じ名前の選手は、クラブがちがっても同じ選手として数えています。</p>';
  // 試合ごとの得点・警告（試合詳細のデータから。名前で合わせる）
  for(const r of cur.filter(r=>r.p.log)){
    getJSON(encodeURIComponent(r.comp.id)+'-matches.json').then(md=>{
      document.querySelectorAll('.plog[data-comp="'+r.comp.id+'"] tr[data-mid]').forEach(tr=>{
        const d=md.details&&md.details[tr.dataset.mid];if(!d)return;
        const side=d.match&&d.match.home&&(d.match.home.univ||d.match.home.name)===(r.team.univ||r.team.name)?'home':'away';
        const ev=[],key=canon(P.name);
        (d.goals||[]).filter(x=>x.side===side&&canon(x.scorer)===key).forEach(x=>ev.push('⚽'+(x.minute?' '+x.minute+"'":'')));
        (d.goals||[]).filter(x=>x.side===side&&x.assist&&canon(x.assist)===key).forEach(x=>ev.push('A'+(x.minute?' '+x.minute+"'":'')));
        (d.cards||[]).filter(x=>x.side===side&&canon(x.name)===key).forEach(x=>ev.push('<span class="'+(x.kind==='C'?'yc':'rc')+'"></span>'+(x.minute?' '+x.minute+"'":'')));
        tr.querySelector('.ev').innerHTML=ev.join('　');
      });
    }).catch(()=>{});
  }
}
const teamUrlP=t=>'./team.html?'+(P.comp?'comp='+encodeURIComponent(P.comp)+'&':'')+'team='+encodeURIComponent(t.id||P.team);
function photoSrc(u,w){u=String(u||'').trim();const d=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/);if(d)return 'https://drive.google.com/thumbnail?id='+d[1]+'&sz=w'+w;if(/^https:\/\//i.test(u))return u;return '';}
init();
</script>
