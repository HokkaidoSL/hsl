<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>北海道サッカーリーグ | レイアウト案② カレンダー</title>
<link rel="icon" href="../../results/favicon.png" sizes="32x32">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./common.css">
<style>
/* ② カレンダー：大会を選ばずに「日付」から入る。試合のある日が横に並び、選んだ日の試合を大会ごとにまとめて出す */
.cal{background:var(--card);border-bottom:1px solid var(--line)}
.months{display:flex;gap:4px;padding-top:14px;overflow-x:auto;scrollbar-width:none}
.months button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.months button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--acc)}
.days{display:flex;gap:6px;overflow-x:auto;padding:12px 0 14px;scroll-snap-type:x proximity;scrollbar-width:thin}
.day{flex:none;width:64px;border:1px solid var(--line);background:var(--card);padding:8px 4px 7px;text-align:center;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:3px}
.day b{font:800 22px/1 var(--num)}
.day small{font-size:10px;color:var(--muted)}
.day .dots{display:flex;gap:2px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--k)}
[data-p=c] .day .dots i{border-radius:0;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.day.sun small,.day.sun b{color:#c62828}.day.sat small,.day.sat b{color:#1565c0}
.day[aria-selected=true]{background:var(--dark);border-color:var(--dark);color:#fff}
.day[aria-selected=true] small,.day[aria-selected=true] b{color:#fff}
.day.today{outline:2px solid var(--hl);outline-offset:-2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding-bottom:12px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:var(--k)}
.k-TOP{--k:var(--acc)}.k-BLK{--k:#49ADE9}.k-BF{--k:#F6B93B}.k-CUP{--k:#8e6bbf}

.lay{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;margin-top:24px;align-items:start}
@media(max-width:900px){.lay{grid-template-columns:minmax(0,1fr)}}
.dh{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
.dh b{font:800 34px/1 var(--num)}
.dh span{font-size:13px;color:var(--muted);font-weight:700}
.grp{margin-bottom:16px}
.gh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:900}
.gh:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--k)}
.gh small{font-weight:500;color:var(--muted);font-size:11px}
.gh a{margin-left:auto;font-size:11.5px;color:var(--acc)}
.m{display:grid;grid-template-columns:50px minmax(0,1fr) 76px minmax(0,1fr);gap:10px;align-items:center;padding:13px 14px;border-top:1px solid var(--line)}
.gh+.m{border-top:0}
.m .ko{font:700 15px/1.1 var(--num);color:var(--muted)}
.m .t{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;min-width:0}
.m .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .t.h{flex-direction:row-reverse;text-align:right}
.m .t.lose{color:var(--muted);font-weight:500}
.m .s{font:800 24px/1 var(--num);text-align:center;background:var(--dark);color:#fff;padding:5px 0}
.m .s.vs{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:14px}
.m .s small{display:block;font:500 9.5px/1.3 "Noto Sans JP";opacity:.8}
.m .v{grid-column:2/-1;font-size:11px;color:var(--muted);margin-top:-4px}
.m:hover{background:var(--soft)}
@media(max-width:600px){.m{grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr)}.m .ko{grid-column:1/-1;font-size:12px}.m .v{grid-column:1/-1}.m .t{font-size:13px}.m .t .crest{display:none}}

.side{display:grid;gap:22px}
.nx{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.nx:first-child{border-top:0}
.nx .d{text-align:center;font:800 18px/1 var(--num)}
.nx .d small{display:block;font:500 10px/1.4 "Noto Sans JP";color:var(--muted)}
.nx b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nx span{font-size:11px;color:var(--muted)}
.pg{padding:10px 14px;border-top:1px solid var(--line);display:grid;gap:6px}
.pg:first-child{border-top:0}
.pg .r{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;gap:8px}
.pg .r small{color:var(--muted);font-weight:500;white-space:nowrap}
.bar{height:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--k)}
</style>
</head>
<body>
<section class="cal"><div class="wrap">
  <div class="months" id="months" role="tablist"></div>
  <div class="days" id="days" role="tablist"></div>
  <div class="legend"><span class="k-TOP"><i></i>北海道リーグ</span><span class="k-BLK"><i></i>ブロックリーグ</span><span class="k-BF"><i></i>決勝大会</span><span class="k-CUP"><i></i>カップ戦・全国予選</span></div>
</div></section>
<main class="wrap lay">
  <section><div class="dh" id="dh"></div><div id="list"><span class="sk"></span></div></section>
  <aside class="side">
    <section><div class="h2"><h2><small>NEXT</small>この先の試合</h2></div><div class="card" id="next"></div></section>
    <section><div class="h2"><h2><small>PROGRESS</small>大会の進みぐあい</h2></div><div class="card" id="prog"></div></section>
  </aside>
</main>
<script src="./common.js"></script>
<script>
chrome();
const KC=c=>c.code==='TOP'?'TOP':/^(SD|DN|DT)$/.test(c.code)?'BLK':c.code==='BF'?'BF':'CUP';
const today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
let ALL=[],DATES=[],SEL='',C=[];
function renderDays(){
  const mon=SEL.slice(0,7),months=[...new Set(DATES.map(d=>d.slice(0,7)))];
  $('months').innerHTML=months.map(m=>'<button role="tab" data-m="'+m+'" aria-selected="'+(m===mon)+'">'+(+m.slice(5))+'月</button>').join('');
  $('days').innerHTML=DATES.filter(d=>d.slice(0,7)===mon).map(d=>{const w=new Date(d+'T00:00:00').getDay(),ks=[...new Set(ALL.filter(m=>m.date===d).map(m=>KC(m._c)))];
    return '<button class="day'+(w===0?' sun':w===6?' sat':'')+(d===today?' today':'')+'" role="tab" data-d="'+d+'" aria-selected="'+(d===SEL)+'"><small>'+(+d.slice(5,7))+'月</small><b>'+(+d.slice(8))+'</b><small>'+WD[w]+'</small><span class="dots">'+ks.map(k=>'<i class="k-'+k+'"></i>').join('')+'</span></button>'}).join('');
  const on=$('days').querySelector('[aria-selected=true]');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
}
function renderList(){
  const ms=order(ALL.filter(m=>m.date===SEL));
  $('dh').innerHTML='<b>'+esc(md(SEL))+'</b><span>（'+wd(SEL)+'）　'+ms.length+'試合</span>';
  const groups=C.map(c=>({c,ms:ms.filter(m=>m._c===c)})).filter(g=>g.ms.length);
  $('list').innerHTML=groups.map(({c,ms})=>'<div class="card grp k-'+KC(c)+'"><div class="gh">'+esc(c.short)+'<small>'+esc(ms[0].round||'')+'</small><a href="'+compUrl(c.id,'')+'">大会記録 ›</a></div>'+
    ms.map(m=>{const f=done(m),lh=f&&m.winner&&m.winner!==m.home.id,la=f&&m.winner&&m.winner!==m.away.id;
      return '<a class="m" href="'+matchUrl(c.id,m)+'"><span class="ko">'+esc(m.kickoff||'–')+'</span><span class="t h'+(lh?' lose':'')+'">'+crest(m.home,'sm')+'<span>'+esc(m.home.short)+'</span></span>'+
        '<span class="s'+(f?'':' vs')+'">'+(f?esc(m.score.home+'-'+m.score.away)+(m.score.pk?'<small>PK '+m.score.pk.home+'-'+m.score.pk.away+'</small>':''):'VS')+'</span><span class="t'+(la?' lose':'')+'">'+crest(m.away,'sm')+'<span>'+esc(m.away.short)+'</span></span>'+
        (m.venue?'<span class="v">📍 '+esc(m.venue)+'</span>':'')+'</a>'}).join('')+'</div>').join('')||'<p class="empty card">この日の試合はありません。</p>';
}
function pick(d){SEL=d;renderDays();renderList();try{history.replaceState(null,'','?d='+d)}catch(e){}}
$('days').onclick=e=>{const b=e.target.closest('[data-d]');if(b)pick(b.dataset.d)};
$('months').onclick=e=>{const b=e.target.closest('[data-m]');if(b)pick(DATES.find(d=>d.startsWith(b.dataset.m)))};
(async()=>{
  await embReady;
  C=await loadAll();
  ALL=C.flatMap(c=>c.data.matches.filter(m=>/^\d{4}-\d{2}-\d{2}$/.test(m.date||'')).map(m=>({...m,_c:c})));
  DATES=[...new Set(ALL.map(m=>m.date))].sort();
  /* はじめに開く日：?d= の日、なければ今日に近い試合日（今日以前の最後の日） */
  const q=QS.get('d');
  pick(DATES.includes(q)?q:([...DATES].reverse().find(d=>d<=today)||DATES[0]));
  const up=order(ALL.filter(m=>!done(m)&&m.date>=today)).slice(0,6);
  $('next').innerHTML=up.length?up.map(m=>'<a class="nx" href="'+matchUrl(m._c.id,m)+'"><span class="d">'+esc(md(m.date))+'<small>（'+wd(m.date)+'）'+esc(m.kickoff||'')+'</small></span><span><b>'+esc(m.home.short)+' vs '+esc(m.away.short)+'</b><span>'+esc(m._c.short+'　'+(m.round||''))+'</span></span></a>').join(''):'<p class="empty">今シーズンの試合はすべて終わりました。</p>';
  $('prog').innerHTML=C.map(c=>{const n=c.data.matches.length,f=c.data.matches.filter(done).length;return '<a class="pg k-'+KC(c)+'" href="'+compUrl(c.id,'')+'"><span class="r">'+esc(c.short)+'<small>'+f+' / '+n+'試合'+(f===n?'　終了':'')+'</small></span><span class="bar"><i style="width:'+(n?f/n*100:0)+'%"></i></span></a>'}).join('');
})().catch(e=>{$('list').innerHTML='<p class="empty">読み込みに失敗しました：'+esc(e.message)+'</p>'});
</script>
</body>
</html>
