<style>
:root{--navy:#071b2e;--navy2:#0e2c48;--lime:#c5f26d;--ink:#141e28;--muted:#6b7a89;--line:#e3e8ee;--bg:#f4f6f8;--blue:#145ec9;--red:#c0392b;--num:"Barlow Condensed","Noto Sans JP",sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{width:min(1100px,100% - 40px);margin:auto}
.demo{background:#fff4d6;color:#7a5a00;font-size:12px;text-align:center;padding:7px 16px}
.header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:30}
.head{height:62px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{height:46px;border-radius:8px;background:#fff;display:flex;align-items:center;flex:none;padding:4px 7px}
.logo img{height:100%;width:auto;display:block}
.brandname{font-size:15px;font-weight:900;line-height:1.25}
.brandname small{display:block;font-family:var(--num);font-size:11px;color:#9fb8cc;letter-spacing:.04em;font-weight:600}
.nav{display:flex;margin-left:auto;height:100%}
.nav a{display:flex;align-items:center;padding:0 13px;font-size:13px;font-weight:700;color:#d2e0eb;border-bottom:3px solid transparent;transition:.15s}
.nav a:hover,.nav a.on{color:#fff;border-bottom-color:var(--lime)}
.menubtn{display:none;margin-left:auto;background:transparent;border:1px solid #ffffff33;color:#fff;border-radius:8px;padding:7px 11px;font-size:12px}
.pagehead{background:var(--navy);color:#fff;border-top:1px solid #ffffff12}
.pagehead .wrap{padding:30px 0 28px}
.crumb{font-size:11px;color:#9fb8cc;margin-bottom:14px}
.crumb a:hover{color:#fff;text-decoration:underline}
.eyebrow{font-family:var(--num);font-size:13px;letter-spacing:.18em;color:var(--lime);font-weight:700}
.pagehead h1{font-size:clamp(26px,4vw,40px);margin:4px 0 0;font-weight:900;letter-spacing:-.02em}
.main{padding:32px 0 64px}
.section{margin-top:44px}
.section:first-child{margin-top:0}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.sechead h2{margin:0;font-size:22px;font-weight:900;line-height:1.3}
.sechead h2 small{display:block;font-family:var(--num);font-size:12px;letter-spacing:.16em;color:var(--blue);font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.empty{padding:22px;color:var(--muted);font-size:13px;margin:0;line-height:1.8}
.note{font-size:11px;color:var(--muted);margin:9px 2px 0;line-height:1.7}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chips button,.chips a{flex:none;border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:30px;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.chips [aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.cat{display:inline-block;font-size:10.5px;font-weight:700;color:var(--blue);border:1px solid #c9daf2;padding:1px 7px;border-radius:3px;white-space:nowrap}
.imp{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;background:var(--red);padding:2px 7px;border-radius:3px}
.footer{background:var(--navy);color:#a5bccf;padding:36px 0 30px;font-size:12px}
.footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.footer strong{color:#fff;font-size:14px}
.footer p{margin:8px 0 0;line-height:1.8}
.footer nav{display:flex;gap:18px;flex-wrap:wrap}
.footer nav a:hover{color:var(--lime)}
.sk{display:block;height:14px;margin:14px 18px;border-radius:6px;background:linear-gradient(90deg,#e9eef3 25%,#f5f8fa 50%,#e9eef3 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}

.jump{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px}
.jump a{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:30px;font-size:12.5px;font-weight:700;color:var(--muted)}
.jump a:hover{border-color:var(--ink);color:var(--ink)}
.ov{display:grid;gap:14px}
.ov article{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 26px}
.ov h3{margin:0 0 10px;font-size:17px;font-weight:900;display:flex;align-items:center;gap:10px}
.ov h3:before{content:"";width:4px;height:18px;background:var(--lime);border-radius:2px}
.ov p{margin:0;font-size:14.5px;line-height:2}
.ov p a,.ct p a{color:var(--blue);text-decoration:underline;word-break:break-all}
.ov .lk{display:inline-block;margin-top:10px;font-size:13px;color:var(--blue);font-weight:700}
.league+.league{margin-top:24px}
.league h3{font-size:14px;font-weight:900;margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
.league h3 span{font-size:11px;color:var(--muted);font-weight:500}
.clubs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px} /* 1行に4つ（スマホは2つ） */
.club{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;transition:.15s;min-width:0}
.club:hover{border-color:var(--blue);transform:translateY(-2px)}
.club .cv{--c:#145ec9;position:relative;width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,var(--c),var(--navy));overflow:hidden}
.club .cv img{width:100%;height:100%;object-fit:cover;display:block}
.club .cv:not(.photo):after{content:"";position:absolute;right:-24px;top:-30px;width:110px;height:110px;border-radius:50%;border:16px solid #ffffff1f}
.club>.crest{margin-top:-22px;position:relative;border:3px solid #fff;box-sizing:content-box}
.club>.crest.img{background:#fff!important;border-radius:50%}
.club div{min-width:0;width:100%;padding:6px 10px 12px}
.club strong{display:block;font-size:14px;overflow-wrap:anywhere}
.club small{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crest{--c:#145ec9;width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px;flex:none;box-shadow:inset 0 0 0 2.5px #ffffff38}
.crest.two{font-size:12px;letter-spacing:-.05em}
.crest.img{background:transparent!important;box-shadow:none!important;border-radius:0}
.crest.img img{width:100%;height:100%;object-fit:contain;display:block}
.crest{position:relative}
.crest .bdg{position:absolute;right:-6px;bottom:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--lime);color:var(--navy);font:800 10px/16px var(--num);font-style:normal;letter-spacing:0;text-align:center;white-space:nowrap;box-shadow:0 0 0 1.5px #fff}
.crest.xs .bdg{display:none}
.crest.sm .bdg{min-width:14px;height:14px;padding:0 3px;font-size:9px;line-height:14px}
.crest.xl .bdg{min-width:28px;height:24px;padding:0 7px;border-radius:12px;font-size:15px;line-height:24px;right:-8px;bottom:-2px}

.docs a,.docs div{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:15px 20px;border-top:1px solid var(--line)}
.docs>:first-child{border-top:0}
.docs a:hover{background:#f6f9fc}
.docs .ic{width:40px;height:40px;border-radius:9px;background:#eef3f7;display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:12px;color:var(--muted)}
.docs .ic.pdf{background:#fdecea;color:var(--red)}
.docs b{font-size:14.5px}
.docs small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.6}
.docs .go{color:var(--muted);font-size:13px}
.ct{background:var(--navy);color:#fff;border-radius:16px;padding:26px 28px;display:grid;gap:18px}
.ct h3{margin:0 0 6px;font-size:17px}
.ct p{margin:0;font-size:14px;line-height:1.9;color:#c9d9e6}
.ct p a{color:var(--lime)}
.ct .btn{display:inline-block;margin-top:12px;background:var(--lime);color:var(--navy);font-weight:700;font-size:14px;padding:11px 22px;border-radius:30px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:820px){.nav a{padding:0 8px;font-size:12px}}
@media(max-width:680px){
  .wrap{width:calc(100% - 32px)}
  .head{height:56px}
  .logo{height:36px;padding:3px 5px}
  .brand{gap:8px}
  .brandname{font-size:13px}
  .menubtn{font-size:0;padding:6px 11px;flex:none}
  .menubtn:before{content:"☰";font-size:18px;line-height:1}
  .brandname small{font-size:9.5px;letter-spacing:0;white-space:normal;line-height:1.25}
  .brandname{font-size:13px}
  .menubtn{display:block}
  .nav{display:none;position:absolute;top:56px;left:0;right:0;flex-direction:column;background:var(--navy);padding:6px 16px 14px;height:auto;border-bottom:1px solid #ffffff1a}
  .nav.open{display:flex}
  .nav a{padding:13px 8px;border-bottom:1px solid #ffffff12}
  .pagehead .wrap{padding:22px 0 22px}
  .main{padding-top:22px}
  .sechead h2{font-size:19px}
  .ov article{padding:18px}
  .clubs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .docs a,.docs div{padding:13px 14px;grid-template-columns:36px 1fr}
  .docs .go{display:none}
  .ct{padding:20px}
  .ct .btn{display:block;text-align:center}
}

/* カードのエンブレムの丸を大きく（2026-10） */
.club>.crest{width:76px;height:76px;margin-top:-40px;font-size:26px}
.club>.crest.two{font-size:21px}
.club>.crest .bdg{min-width:22px;height:20px;line-height:20px;font-size:12px;border-radius:10px}
@media(max-width:680px){.club>.crest{width:60px;height:60px;margin-top:-32px;font-size:21px}.club>.crest.two{font-size:16px}}

/* ---- 歴代成績 ---- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.ht{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
table.ht th{font-size:11px;color:var(--muted);font-weight:700;text-align:center;padding:10px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.ht td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.ht td.l,table.ht th.l{text-align:left}
table.ht tr:last-child td{border-bottom:0}
table.ht .num{font-family:var(--num);font-size:16px;font-weight:700}
table.ht .pts{font-family:var(--num);font-size:18px;font-weight:800}
table.ht tr.top1 td{background:rgba(230,0,18,.10)}
.rk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-family:var(--num);font-weight:800;font-size:15px}
.rk.r1{background:var(--accent,#E60012);color:#fff}
.champ{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:8px}
.champ a{display:block;background:var(--card,#fff);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.champ a:hover{border-color:var(--accent,#E60012)}
.champ .y{font-family:var(--num);font-size:24px;font-weight:800;line-height:1}
.champ .y small{font-family:"Noto Sans JP",sans-serif;font-size:11px;color:var(--muted);font-weight:700;margin-left:6px}
.champ .w{margin-top:8px;font-size:15px;font-weight:900}
.champ .w b{font-size:11px;color:var(--accent,#E60012);margin-right:6px;font-weight:900}
.champ .s{margin-top:4px;font-size:12px;color:var(--muted);line-height:1.6}
.ing{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;background:#555;padding:1px 7px;border-radius:3px;margin-left:6px;vertical-align:2px}
.yh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.yh h3{margin:0;font-size:19px;font-weight:900}
.yh .sub{font-size:12px;color:var(--muted)}
.block{margin-top:22px}
.block h4{margin:0 0 8px;font-size:15px;font-weight:900}
.aw{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.aw .card{padding:14px 16px}
.aw h5{margin:0 0 8px;font-size:13px;color:var(--accent,#E60012);font-weight:900}
.aw ul{margin:0;padding:0;list-style:none}
.aw li{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:13px;align-items:baseline}
.aw li:first-child{border-top:0}
.aw .p{font-family:var(--num);font-size:12px;color:var(--muted);width:24px;flex:none}
.aw .n{font-weight:700}
.aw .n small{white-space:nowrap}
.aw .t{color:var(--muted);font-size:11.5px;margin-left:auto;text-align:right}
.po .card{padding:12px 16px;margin-bottom:8px;font-size:14px}
.po .sc{font-family:var(--num);font-size:22px;font-weight:800;margin:0 10px}
.po small{color:var(--muted);font-size:11px}
.mt{font-size:13px}
.mt .rd{font-size:12px;font-weight:900;color:var(--muted);margin:12px 0 4px}
.mt .m{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.mt .m .h,.mt .m .a{flex:1;min-width:0}
.mt .m .h{text-align:right}
.mt .m b.win{color:var(--accent,#E60012)}
.mt .m .sc{font-family:var(--num);font-size:18px;font-weight:800;width:64px;text-align:center;flex:none}
.mt .m .sc small{display:block;font-size:10px;color:var(--muted);font-weight:700}
/* トーナメント表（右が決勝） */
.bk{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:12px 4px}
.bkn{display:flex;align-items:center}
.bkk{display:flex;flex-direction:column}
.bkk>.bkc{position:relative;padding:3px 14px 3px 0}
.bkk>.bkc::after{content:"";position:absolute;right:0;width:14px;border-right:2px solid var(--line)}
.bkk>.bkc:first-child::after{top:50%;bottom:0;border-top:2px solid var(--line)}
.bkk>.bkc:last-child::after{top:0;bottom:50%;border-bottom:2px solid var(--line)}
.bkm{position:relative;margin-left:14px;background:var(--card2,#232323);border:1px solid var(--line);border-radius:8px;width:178px;flex:none;font-size:12px}
.bkm.first{margin-left:0}
.bkm.first::before{display:none}
.bkm::before{content:"";position:absolute;left:-16px;top:50%;width:14px;border-top:2px solid var(--line)}
.bkn.root>.bkm{border-color:var(--accent,#E60012)}
.bkm .t{display:flex;justify-content:space-between;gap:6px;padding:5px 8px;line-height:1.3}
.bkm .t+.t{border-top:1px solid var(--line)}
.bkm .t b{font-family:var(--num);font-size:15px;flex:none}
.bkm .t.w{color:var(--accent,#E60012);font-weight:900}
.bkm .r{font-size:10px;color:var(--muted);padding:3px 8px 0}
.bkm .pk{font-size:10px;color:var(--muted);padding:0 8px 4px;text-align:right}
.bkl{background:transparent;border:1px dashed var(--line);border-radius:8px;width:178px;padding:5px 8px;font-size:12px;color:var(--muted);flex:none}
@media(max-width:680px){.champ{grid-template-columns:1fr 1fr}.champ a{padding:12px}.champ .w{font-size:13px}table.ht{font-size:12px}}
</style>

<style>
/* 歴代記録（2000〜2026年度は archive.json、2027年度からはシステムが書き出す 年度.json） */
.arc{--w:#145ec9;--l:#c0392b;font-size:14px;line-height:1.6}
.arc .views{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:16px}
.arc .views button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:10px 16px;font-weight:700;color:var(--muted)}
.arc .views button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--blue)}
.arc .yearbar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.arc .yearbar select{font:inherit;font-size:16px;font-weight:700;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:0;flex:1;max-width:260px}
.arc .yearbar .step{border:1px solid var(--line);background:#fff;border-radius:8px;width:40px;height:40px;font-size:18px;flex:none}
.arc .yearbar .step:disabled{color:var(--line);cursor:default}
.arc .ychamp{margin:12px 0 4px;font-size:15px}
.arc .ychamp b{color:var(--w)}
.arc .chips{margin:14px 0 10px}
.arc .chips .na{font-size:10px;margin-left:4px;opacity:.7;font-weight:500}
.arc .card{padding:4px 16px 14px}
.arc .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
.arc table{border-collapse:collapse;width:100%;font-size:13.5px}
.arc th,.arc td{border-bottom:1px solid var(--line);padding:8px 7px;text-align:right;white-space:nowrap}
.arc thead th{font-weight:700;color:var(--muted);font-size:11.5px;border-bottom:1px solid var(--ink)}
.arc th.l,.arc td.l{text-align:left}
.arc td.team{text-align:left;font-weight:700}
.arc td.pts{font-weight:900}
.arc tr.first td.team{color:var(--w)}
.arc .tag{display:inline-block;font-size:11px;color:var(--muted);margin-left:6px;font-weight:400}
.arc h3{font-size:16px;margin:20px 0 6px}
.arc h4{font-size:13px;font-weight:700;color:var(--muted);margin:20px 0 6px}
.arc table.matrix{font-size:12px;width:auto;margin-top:8px}
.arc table.matrix th,.arc table.matrix td{text-align:center;padding:6px;border:1px solid var(--line)}
.arc table.matrix thead th{color:var(--ink);font-size:11px;line-height:1.3;min-width:56px}
.arc table.matrix td.team{text-align:left;font-size:12.5px;position:sticky;left:0;background:#fff;z-index:1}
.arc table.matrix th.corner{position:sticky;left:0;background:#fff;z-index:2}
.arc table.matrix td.self{background:#eef2f6}
.arc .leg{display:block;line-height:1.5;font-variant-numeric:tabular-nums}
.arc .leg.w{color:var(--w);font-weight:700}
.arc .leg.l{color:var(--l)}
.arc .leg small{font-size:10px;font-weight:400;margin-left:2px}
.arc .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0 0}
.arc .legend .w{color:var(--w);font-weight:700}.arc .legend .l{color:var(--l)}
.arc .awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 32px}
.arc dl.aw{margin:0}
.arc dl.aw div{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.arc dl.aw dt{color:var(--muted);font-size:12.5px}
.arc dl.aw dd{margin:0}
.arc dl.aw dd span{display:block}
.arc .t{color:var(--muted);font-size:12px;margin-left:6px;font-weight:400}
.arc .notes{margin:12px 0 0;padding:0;list-style:none;font-size:12.5px}
.arc .notes li{padding:6px 0;border-bottom:1px solid var(--line)}
.arc .notes li b{font-weight:700;color:var(--muted);margin-right:8px}
.arc .empty{padding:22px 0}
.arc td.wrap{white-space:normal;min-width:140px;line-height:1.45}
.arc td.wrap .t{display:block;margin-left:0}
.arc .blk-champ{margin:12px 0 2px;font-size:14px}.arc .blk-champ b{color:var(--w)}
.arc .more{display:inline-block;margin-top:12px;font-size:13px;font-weight:700;color:var(--blue)}
.arc .source{margin-top:28px;font-size:11.5px;color:var(--muted);line-height:1.7}
.arc .source a{text-decoration:underline}
@media(max-width:600px){.arc dl.aw div{grid-template-columns:100px 1fr}.arc .views button{padding:10px 12px}}
</style>
<main class="wrap main">
  <div class="arc" id="arc">
    <p class="note" style="margin:0 0 14px">北海道サッカーリーグの2000年度（第23回）からの順位表・星取表・得点ランキング・表彰選手と、ブロックリーグ・ブロック決勝大会の記録です。</p>
    <div class="views" role="tablist">
      <button role="tab" data-view="season" aria-selected="true">年度別</button>
      <button role="tab" data-view="history" aria-selected="false">歴代優勝</button>
    </div>
    <section data-panel="season">
      <div class="yearbar">
        <button class="step" data-step="-1" aria-label="前の年度">‹</button>
        <select id="year" aria-label="年度をえらぶ"></select>
        <button class="step" data-step="1" aria-label="次の年度">›</button>
      </div>
      <div class="ychamp" id="champ"></div>
      <div class="chips" role="tablist" id="subtabs"></div>
      <div class="card" id="body"><span class="sk"></span><span class="sk"></span></div>
    </section>
    <section data-panel="history" hidden>
      <h3 style="margin-top:4px">北海道リーグ 歴代優勝</h3>
      <div class="card"><div class="scroll"><table id="hist"></table></div></div>
      <h3>ブロックリーグ 歴代優勝</h3>
      <div class="card"><div class="scroll"><table id="histBlk"></table></div></div>
    </section>
    <p class="source" id="source"></p>
  </div>
</main>

<footer class="footer">
  <div class="wrap">
    <div><strong>北海道サッカーリーグ</strong><p>2027年度からは、連盟の大会運営システムから自動で記録しています。</p><p id="updated"></p></div>
    <nav><a href="./">トップ</a><a href="./news.html">お知らせ</a><a href="./about.html">連盟について</a><a href="./results.html">大会記録</a><a href="./history.html">歴代成績</a></nav>
  </div>
</footer>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const QS=new URLSearchParams(location.search);
$('menu').addEventListener('click',()=>{const o=$('nav').classList.toggle('open');$('menu').setAttribute('aria-expanded',String(o))});

let SEASONS=[],BLOCKS={},FINALS={},byYear={},years=[],REC=new Set();
const state={year:0,tab:QS.get('tab')||'standings',block:0};
async function load(f){try{const r=await fetch('../results/data/history/'+f,{cache:'no-store'});return r.ok?await r.json():null}catch(e){return null}}

/* システムが書き出した年度（2027年度から）を、歴代記録と同じ形にする */
const BLK={SD:'札幌・道央ブロック',DN:'道南ブロック',DT:'道東・道北ブロック'};
function rowsOf(c){const t=c&&c.standings&&c.standings[0]&&c.standings[0].table;return (t||[]).map(r=>({rank:r.rank,team:r.team?r.team.name:'',pts:r.points,p:r.played,w:r.won,d:r.drawn,l:r.lost,gf:r.goalsFor,ga:r.goalsAgainst,note:r.note||''}))}
function fromSystem(y,d){
  const k=c=>String(c.id).split('-').pop(),cs=d.competitions||[],top=cs.find(c=>k(c)==='TOP');
  if(!top||!rowsOf(top).length)return null;
  const rows=rowsOf(top),ed=(String(top.name).match(/第(\d+)回/)||[])[1];
  const s={year:+y,edition:ed?+ed:'',sys:true,finished:!!top.finished,asOf:top.asOf||'',divisions:[{label:'',pk:false,rows}],
    champions:[top.finished?((top.champion&&top.champion.name)||rows[0].team):''],promoted:[],playoff:[],notes:[],
    scorers:(top.scorers||[]).length?{rows:top.scorers.map(x=>({rank:x.rank,name:x.name,team:x.team,goals:x.count})),total:''}:null,
    awardsList:(top.awards||[]).length?top.awards:null,leader:rows[0].team};
  const bl=cs.filter(c=>BLK[k(c)]&&rowsOf(c).length).map(c=>{const r=rowsOf(c);return {name:BLK[k(c)],champ:c.finished?((c.champion&&c.champion.name)||r[0].team):'',stages:[{pk:false,rows:r}],playoff:[]}});
  if(bl.length)BLOCKS[y]=bl;
  const bf=cs.find(c=>k(c)==='BF');
  if(bf&&bf.standings&&bf.standings.length)FINALS[y]={entrants:[],groups:bf.standings.map(g=>({pk:false,rows:rowsOf({standings:[g]})}))};
  return s;
}

async function boot(){
  try{const r=await fetch('../results/data/competitions.json',{cache:'no-store'});if(r.ok)((await r.json()).competitions||[]).forEach(c=>REC.add(c.id))}catch(e){}
  const a=await load('archive.json');
  if(a){SEASONS=a.seasons||[];BLOCKS=a.blocks||{};FINALS=a.finals||{};if(a.source)$('source').innerHTML=a.source.replace(/^<p[^>]*>|<\/p>$/g,'')}
  const last=SEASONS.length?SEASONS[SEASONS.length-1].year:2026,now=new Date().getFullYear();
  const got=await Promise.all(Array.from({length:Math.max(0,now+1-last)},(_,i)=>last+1+i).map(y=>load(y+'.json').then(d=>[y,d])));
  got.forEach(([y,d])=>{if(d&&d.competitions){const s=fromSystem(y,d);if(s)SEASONS.push(s)}});
  SEASONS.forEach(s=>{byYear[s.year]=s});years=SEASONS.map(s=>s.year);
  if(!years.length){$('body').innerHTML='<p class="empty">記録を読み込めませんでした。時間をおいて開き直してください。</p>';return}
  state.year=byYear[+QS.get('year')]?+QS.get('year'):years[years.length-1];
  const sel=$('year');
  years.slice().reverse().forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y+'年度'+(byYear[y].edition?'（第'+byYear[y].edition+'回）':'');sel.appendChild(o)});
  sel.onchange=()=>{state.year=+sel.value;render()};
  document.querySelectorAll('#arc .step').forEach(b=>b.onclick=()=>{const i=years.indexOf(state.year)+(+b.dataset.step);if(i>=0&&i<years.length){state.year=years[i];render()}});
  document.querySelectorAll('#arc .views button').forEach(b=>b.onclick=()=>view(b.dataset.view));
  drawHistory();
  if(QS.get('view')==='history')view('history');
  render();
}
function view(v){
  document.querySelectorAll('#arc .views button').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.view===v)));
  document.querySelectorAll('#arc [data-panel]').forEach(p=>p.hidden=p.dataset.panel!==v);
}

const TABS=[
  {id:'standings',label:'順位表',has:()=>true},
  {id:'matrix',label:'星取表',has:s=>s.sys||s.divisions.every(d=>d.abbr)},
  {id:'scorers',label:'得点ランキング',has:s=>!!s.scorers},
  {id:'awards',label:'表彰選手',has:s=>!!(s.awards||s.awardsList)},
  {id:'blocks',label:'ブロックリーグ',has:s=>!!BLOCKS[s.year]},
  {id:'final',label:'ブロック決勝大会',has:s=>!!FINALS[s.year]}
];
function render(){
  const s=byYear[state.year],i=years.indexOf(state.year);
  $('year').value=state.year;
  document.querySelector('#arc [data-step="-1"]').disabled=i===0;
  document.querySelector('#arc [data-step="1"]').disabled=i===years.length-1;
  $('champ').innerHTML=s.sys&&!s.finished?'シーズン中　首位 <b>'+esc(s.leader)+'</b>':
    s.divisions.length>1?s.divisions.map((d,k)=>esc(d.label)+'優勝 <b>'+esc(s.champions[k])+'</b>').join('　'):'優勝 <b>'+esc(s.champions[0])+'</b>';
  if(!TABS.find(t=>t.id===state.tab))state.tab='standings';
  $('subtabs').innerHTML=TABS.map(t=>'<button role="tab" data-tab="'+t.id+'" aria-selected="'+(state.tab===t.id)+'">'+t.label+(t.has(s)?'':'<span class="na">未収録</span>')+'</button>').join('');
  $('subtabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){state.tab=b.dataset.tab;render()}};
  const on=$('subtabs').querySelector('[aria-selected=true]');if(on)$('subtabs').scrollLeft=on.offsetLeft-$('subtabs').offsetLeft-16;
  const f={standings,matrix,scorers,awards,blocks,final:finalT}[state.tab];
  $('body').innerHTML=f(s);
  $('body').querySelectorAll('[data-blk]').forEach(b=>b.onclick=()=>{state.block=+b.dataset.blk;render()});
  try{history.replaceState(null,'','?year='+state.year+(state.tab!=='standings'?'&tab='+state.tab:''))}catch(e){}
}

const divTitle=(s,d)=>s.divisions.length>1?'<h3>'+esc(d.label)+'</h3>':'';
const signed=n=>n>0?'+'+n:n===0?'±0':String(n);
function stTable(d){
  const head=d.pk?'<th>勝</th><th>PK勝</th><th>PK負</th><th>負</th>':'<th>勝</th><th>分</th><th>負</th>';
  let out='<div class="scroll"><table><thead><tr><th class="l">順位</th><th class="l">チーム</th><th>勝点</th><th>試合</th>'+head+'<th>得点</th><th>失点</th><th>得失点差</th></tr></thead><tbody>';
  d.rows.forEach(r=>{
    const mid=d.pk?'<td>'+r.w+'</td><td>'+r.pkw+'</td><td>'+r.pkl+'</td><td>'+r.l+'</td>':'<td>'+r.w+'</td><td>'+r.d+'</td><td>'+r.l+'</td>';
    out+='<tr class="num'+(r.rank===1?' first':'')+'"><td class="l">'+esc(r.rank)+'</td><td class="team">'+esc(r.team)+(r.note?'<span class="tag">'+esc(r.note)+'</span>':'')+'</td><td class="pts">'+esc(r.pts)+'</td><td>'+esc(r.p)+'</td>'+mid+'<td>'+esc(r.gf)+'</td><td>'+esc(r.ga)+'</td><td>'+(r.gf!=null&&r.ga!=null?signed(r.gf-r.ga):'')+'</td></tr>';
  });
  return out+'</tbody></table></div>';
}
const PKNOTE='<ul class="notes"><li><b>勝点</b>勝ち3・PK勝ち2・PK負け1・負け0（引き分けのときはPK戦で決める）</li></ul>';
function standings(s){
  let out='';
  s.divisions.forEach(d=>{out+=divTitle(s,d)+stTable(d)});
  if(s.divisions[0].pk)out+=PKNOTE;
  return out+seasonNotes(s)+sysLink(s);
}
/* 大会記録のページに試合ごとの記録（得点・メンバー・スタッツ）がある年度は、そこへのリンクを出す */
const sysLink=s=>s.sys||REC.has(s.year+'-TOP')?'<a class="more" href="./results.html?comp='+s.year+'-TOP">'+s.year+'年度の試合ごとの記録（得点・メンバー・スタッツ）を見る ›</a>':'';
function seasonNotes(s){
  const li=[];
  if(s.year===2020)li.push('<li><b>方式</b>1回戦総当たり（各7試合）で実施</li>');
  if(s.year===2021)li.push('<li><b>方式</b>10チーム参加・日程縮小（各5試合、未実施の対戦あり）</li>');
  (s.notes||[]).forEach(n=>li.push('<li><b>備考</b>'+esc(n)+'</li>'));
  (s.playoff||[]).forEach(p=>li.push('<li><b>入替戦など</b>'+esc(p)+'</li>'));
  if((s.promoted||[]).length)li.push('<li><b>次の年度に昇格</b>'+s.promoted.map(esc).join('、')+'</li>');
  return li.length?'<ul class="notes">'+li.join('')+'</ul>':'';
}
function mxTable(d){
  let out='<div class="scroll"><table class="matrix"><thead><tr><th class="corner"></th>';
  d.abbr.forEach(a=>{out+='<th>'+esc(a)+'</th>'});
  out+='</tr></thead><tbody>';
  d.rows.forEach((r,i)=>{
    out+='<tr><td class="team">'+r.rank+'. '+esc(r.team)+'</td>';
    (r.legs||[]).forEach((legs,j)=>{
      if(i===j){out+='<td class="self"></td>';return}
      if(!legs||!legs.length){out+='<td><span class="leg">－</span></td>';return}
      out+='<td>'+legs.map(g=>{
        const sym=g[0];let cls=sym==='○'?'w':sym==='●'?'l':'',extra='';
        if(d.pk&&sym==='△'){cls='w';extra='<small>PK</small>'}
        if(d.pk&&sym==='▲'){cls='l';extra='<small>PK</small>'}
        return '<span class="leg '+cls+'">'+g[1]+'-'+g[2]+extra+'</span>';
      }).join('')+'</td>';
    });
    out+='</tr>';
  });
  return out+'</tbody></table></div>';
}
const legend=(pk,last)=>'<div class="legend"><span><span class="w">青</span>＝勝ち</span><span><span class="l">赤</span>＝負け</span><span>黒＝引き分け</span>'+(pk?'<span>PK＝同点のあとのPK戦の結果</span>':'')+'<span>'+last+'</span></div>';
function matrix(s){
  if(s.sys)return '<p class="empty">この年度の星取表は、大会記録のページで見られます。</p>'+sysLink(s);
  if(!s.divisions.every(d=>d.abbr))return '<p class="empty">この年度の星取表は未収録です。</p>';
  let out='';
  s.divisions.forEach(d=>{out+=divTitle(s,d)+mxTable(d)});
  return out+legend(s.divisions[0].pk,'各マスは、行のチームから見たスコア（1回戦・2回戦）')+sysLink(s);
}
function blocks(s){
  const bl=BLOCKS[s.year];
  if(!bl)return '<p class="empty">この年度のブロックリーグは未収録です（収録は2003年度から）。</p>';
  if(state.block>=bl.length)state.block=0;
  const b=bl[state.block];
  let out='<div class="chips" role="tablist" style="margin-top:12px">'+bl.map((x,k)=>'<button role="tab" data-blk="'+k+'" aria-selected="'+(k===state.block)+'">'+esc(x.name.replace('ブロック',''))+'</button>').join('')+'</div>';
  out+='<p class="blk-champ">'+esc(b.name)+(b.champ?' 優勝 <b>'+esc(b.champ)+'</b>':'')+'</p>';
  if(b.stages[0].rankOnly){
    out+='<div class="scroll"><table><thead><tr><th class="l">順位</th><th class="l">チーム</th></tr></thead><tbody>';
    b.stages[0].rows.forEach(r=>{out+='<tr class="num'+(r.rank===1?' first':'')+'"><td class="l">'+r.rank+'</td><td class="team">'+esc(r.team)+'</td></tr>'});
    return out+'</tbody></table></div><ul class="notes"><li><b>備考</b>この年度は最終順位だけ収録（試合の結果は未収録）</li></ul>';
  }
  let pk=false;
  out+='<h4>順位表</h4>';
  b.stages.forEach((d,k)=>{if(d.pk)pk=true;out+=(b.stageLabels?'<h4>'+esc(b.stageLabels[k])+'</h4>':'')+stTable(d)});
  if(b.stages.every(d=>d.abbr)){
    out+='<h4>星取表</h4>';
    b.stages.forEach((d,k)=>{out+=(b.stageLabels?'<h4>'+esc(b.stageLabels[k])+'</h4>':'')+mxTable(d)});
    out+=legend(pk,'各マスは、行のチームから見たスコア（対戦順）');
  }
  if((b.playoff||[]).length)out+='<ul class="notes">'+b.playoff.map(p=>'<li><b>入替戦</b>'+esc(p)+'</li>').join('')+'</ul>';
  return out;
}
function finalT(s){
  const f=FINALS[s.year];
  if(!f)return '<p class="empty">この年度のブロックリーグ決勝大会は未収録です（収録は2003年度から）。</p>';
  let out='<p class="blk-champ">ブロックリーグ決勝大会'+(f.groups.length>1||!f.groups[0].rows.length?'':' 1位 <b>'+esc(f.groups[0].rows[0].team)+'</b>')+'</p>';
  if((f.entrants||[]).length)out+='<ul class="notes">'+f.entrants.map(e=>'<li><b>'+esc(e[0])+' '+esc(e[1])+'</b>'+esc(e[2])+'</li>').join('')+'</ul>';
  let pk=false;
  f.groups.forEach((d,k)=>{if(d.pk)pk=true;out+='<h4>'+(f.groups.length>1?'グループ'+(k+1)+' ':'')+'順位表</h4>'+stTable(d)+(d.abbr?mxTable(d):'')});
  if(f.groups.some(d=>d.abbr))out+=legend(pk,'各マスは、行のチームから見たスコア');
  if(pk)out+=PKNOTE;
  return out;
}
function scorers(s){
  if(!s.scorers)return '<p class="empty">この年度の得点ランキングは未収録です（収録は2016年度から）。</p>';
  let out='<div class="scroll"><table><thead><tr><th class="l">順位</th><th class="l">選手</th><th class="l">チーム</th><th>得点</th></tr></thead><tbody>',prev=null;
  s.scorers.rows.forEach(r=>{const show=r.rank!==prev;prev=r.rank;
    out+='<tr class="num'+(r.rank===1?' first':'')+'"><td class="l">'+(show?esc(r.rank):'')+'</td><td class="team">'+esc(r.name)+'</td><td class="l">'+esc(r.team)+'</td><td class="pts">'+esc(r.goals)+'</td></tr>'});
  out+='</tbody></table></div><ul class="notes">'+(s.scorers.total?'<li><b>総得点</b>'+esc(s.scorers.total)+'</li>':'')+'<li><b>範囲</b>上位10位（同じ順位をふくむ）まで</li></ul>';
  return out;
}
const person=(p,tag)=>!p[1]?'<span>'+esc(p[0])+'</span>':'<span>'+esc(p[0])+'<span class="t">'+esc(p[1])+(tag&&p[2]?'・'+esc(p[2]):'')+'</span></span>';
function awards(s){
  if(s.awardsList)return '<dl class="aw">'+s.awardsList.map(a=>'<div><dt>'+esc(a.award)+'</dt><dd>'+a.list.map(p=>'<span>'+esc(p.name)+(p.team?'<span class="t">'+esc(p.team)+'</span>':'')+'</span>').join('')+'</dd></div>').join('')+'</dl>';
  const a=s.awards;
  if(!a)return '<p class="empty">この年度の表彰選手は未収録です（収録は2019年度と2022年度から）。</p>';
  let left='<dl class="aw">';
  a.team.forEach(t=>{left+='<div><dt>'+esc(t[0])+'</dt><dd><span>'+esc(t[1])+(t[2]?'<span class="t">'+esc(t[2])+'</span>':'')+'</span></dd></div>'});
  left+='<div><dt>最優秀選手（MVP）</dt><dd>'+a.mvp.map(p=>person(p,true)).join('')+'</dd></div>';
  left+='<div><dt>得点王</dt><dd>'+a.topscorer.map(p=>person(p,true)).join('')+'</dd></div>';
  left+='<div><dt>最優秀新人賞</dt><dd>'+(a.rookie.length?a.rookie.map(p=>person(p)).join(''):'<span>該当なし</span>')+'</dd></div>';
  left+='<div><dt>優秀新人賞</dt><dd>'+a.rookie2.map(p=>person(p)).join('')+'</dd></div>';
  left+='<div><dt>監督賞</dt><dd>'+a.coach.map(p=>person(p)).join('')+'</dd></div></dl>';
  let right='<dl class="aw">';
  ['GK','DF','MF','FW'].forEach(pos=>{right+='<div><dt>ベストイレブン '+pos+'</dt><dd>'+a.best11[pos].map(p=>person(p,true)).join('')+'</dd></div>'});
  right+='</dl>';
  return '<div class="awards">'+left+right+'</div><ul class="notes"><li><b>出典</b>北海道サッカー協会「'+esc(a.source)+'」。回数は受賞した回数</li></ul>';
}
function drawHistory(){
  const dash='<span style="color:var(--muted)">－</span>';
  let h='<thead><tr><th class="l">年度</th><th class="l">回</th><th class="l">優勝</th><th class="l">準優勝</th><th class="l">3位</th><th class="l">得点王</th><th class="l">MVP</th></tr></thead><tbody>';
  SEASONS.slice().reverse().forEach(s=>{
    const r=s.divisions[0].rows,ing=s.sys&&!s.finished;
    const sc=s.scorers&&!ing?s.scorers.rows.filter(x=>x.rank===1).map(x=>'<span>'+esc(x.name)+'<span class="t">'+esc(x.team)+'・'+esc(x.goals)+'点</span></span>').join(''):dash;
    const mvpL=s.awards?s.awards.mvp.map(p=>esc(p[0])+'<span class="t">'+esc(p[1])+'</span>'):s.awardsList?((s.awardsList.find(a=>/MVP|最優秀選手/.test(a.award))||{}).list||[]).map(p=>esc(p.name)+'<span class="t">'+esc(p.team||'')+'</span>'):[];
    const nm=k=>r[k]?esc(r[k].team):'';
    h+='<tr><td class="l num"><a href="?year='+s.year+'" data-y="'+s.year+'" style="text-decoration:underline">'+s.year+'</a></td><td class="l num">'+(s.edition?'第'+s.edition+'回':'')+'</td>'+
      (ing?'<td class="l" colspan="3" style="color:var(--muted)">シーズン中（首位 '+nm(0)+'）</td>':'<td class="team" style="color:#145ec9">'+esc(s.champions[0]||nm(0))+'</td><td class="l">'+nm(1)+'</td><td class="l">'+nm(2)+'</td>')+
      '<td class="l wrap">'+sc+'</td><td class="l wrap">'+(mvpL.length?mvpL.join(''):dash)+'</td></tr>';
  });
  $('hist').innerHTML=h+'</tbody>';
  let hb='<thead><tr><th class="l">年度</th><th class="l">決勝大会 1位<br><span style="font-weight:400">（2組の年は各組1位）</span></th><th class="l">各ブロックの優勝</th></tr></thead><tbody>';
  SEASONS.slice().reverse().forEach(s=>{
    const bl=BLOCKS[s.year],f=FINALS[s.year];if(!bl)return;
    const fin=f&&f.groups[0].rows.length?f.groups.map(g=>esc(g.rows[0].team)).join('<br>'):'－';
    hb+='<tr><td class="l num">'+s.year+'</td><td class="l wrap" style="color:#145ec9">'+fin+'</td><td class="l wrap">'+bl.map(b=>'<span style="display:inline-block;margin-right:14px"><span style="color:var(--muted);font-size:12px">'+esc(b.name.replace('ブロック',''))+'</span> '+esc(b.champ||'－')+'</span>').join('')+'</td></tr>';
  });
  $('histBlk').innerHTML=hb+'</tbody>';
  $('hist').onclick=e=>{const a=e.target.closest('a[data-y]');if(!a)return;e.preventDefault();state.year=+a.dataset.y;state.tab='standings';view('season');render();$('arc').scrollIntoView({behavior:'smooth'})};
}
boot();
</script>
