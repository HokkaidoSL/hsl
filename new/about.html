<style>
/* 連盟についてのページだけの部品（色・影・角丸は hsl.css の変数だけ。DESIGN.md） */
.demo{background:var(--card2);color:var(--logo-y);font-size:12px;font-weight:700;text-align:center;padding:8px 16px;margin-top:12px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:12px}
.crumb a{color:var(--logo-b)}
.crumb a:hover{text-decoration:underline}
main.main{padding-top:24px}
.card{overflow:hidden}
.sec:first-child{margin-top:0}

.jump{margin-bottom:32px;flex-wrap:wrap;overflow:visible}
.jump a{display:inline-flex;align-items:center}
.jump a:hover{background:var(--line)}
.ov{display:grid;gap:12px}
.ov article{padding:24px}
.ov h3{margin:0 0 12px;font-size:18px;font-weight:900;line-height:1.4;display:flex;align-items:center;gap:10px}
.ov h3:before{content:"";width:4px;height:18px;background:var(--logo-y);border-radius:2px;flex:none}
.ov p{margin:0;font-size:16px;line-height:1.7}
.ov p a,.ct p a,.docs small a{color:var(--logo-b);text-decoration:underline;word-break:break-all}
.ov .lk{display:inline-flex;align-items:center;min-height:44px;margin-top:4px;font-size:14px;color:var(--logo-b);font-weight:700}
.league+.league{margin-top:24px}
.league h3{font-size:16px;font-weight:900;margin:0 0 12px;display:flex;gap:8px;align-items:baseline;line-height:1.4}
.league h3:before{content:"";width:4px;height:16px;background:var(--logo-g);border-radius:2px;align-self:center;flex:none}
.league h3 span{font-size:12px;color:var(--muted);font-weight:500}
.clubs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px} /* 1行に4つ（スマホは2つ） */
.club{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-card);overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;transition:.15s;min-width:0}
.club:hover{background:var(--card2)}
.club:hover strong{color:var(--logo-b)}
.club .cv{--c:var(--draw);position:relative;width:100%;aspect-ratio:16/9;background:var(--c);overflow:hidden}
.club .cv img{width:100%;height:100%;object-fit:cover;display:block}
.club .cv:not(.photo):after{content:"";position:absolute;right:-24px;top:-30px;width:110px;height:110px;border-radius:50%;border:16px solid var(--ink);opacity:.12}
.club>.crest{position:relative;overflow:visible;border:3px solid var(--card);box-sizing:content-box;box-shadow:var(--shadow-card)}
.club:hover>.crest{border-color:var(--card2)}
.club>.crest.img{background:#fff;padding:6px;box-sizing:border-box;width:82px;height:82px}
.club div{min-width:0;width:100%;padding:8px 12px 12px}
.club strong{display:block;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.crest .bdg{position:absolute;right:-6px;bottom:-4px;min-width:22px;height:20px;padding:0 5px;border-radius:var(--r-pill);background:var(--logo-y);color:var(--navy);font:800 12px/20px var(--num);font-style:normal;letter-spacing:0;text-align:center;white-space:nowrap;box-shadow:0 0 0 2px var(--card)}

.docs a,.docs div{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:16px;border-top:1px solid var(--line);min-height:44px}
.docs>:first-child{border-top:0}
.docs a:hover{background:var(--card2)}
.docs a:hover b{color:var(--logo-b)}
.docs .ic{width:40px;height:40px;border-radius:var(--r-sm);background:var(--card2);display:grid;place-items:center;font:800 12px/1 var(--num);letter-spacing:.04em;color:var(--muted)}
.docs .ic.pdf{background:var(--red-bg);color:#fff}
.docs b{font-size:15px;line-height:1.5}
.docs small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.6}
.docs .go{color:var(--logo-b);font-size:14px;font-weight:700;white-space:nowrap}
.ct{padding:24px;display:grid;gap:16px;box-shadow:var(--shadow-card),inset 4px 0 0 var(--logo-b)}
.ct h3{margin:0 0 8px;font-size:18px;line-height:1.4;font-weight:900}
.ct p{margin:0;font-size:16px;line-height:1.7;color:var(--muted)}
.ct .btn{margin-top:12px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:600px){
  main.main{padding-top:16px}
  .jump{margin-bottom:24px}
  .jump a{min-height:44px}
  .ov article{padding:16px}
  .clubs{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .docs a,.docs div{padding:12px 16px;grid-template-columns:36px 1fr}
  .docs .ic{width:36px;height:36px}
  .docs .go{display:none}
  .ct{padding:16px}
  .ct .btn{display:flex;width:100%}
}

/* カードのエンブレムの丸を大きく（2026-10） */
.club>.crest{width:76px;height:76px;margin-top:-40px;font-size:26px}
.club>.crest.two{font-size:21px}
@media(max-width:600px){.club>.crest{width:60px;height:60px;margin-top:-32px;font-size:21px}.club>.crest.img{width:66px;height:66px}.club>.crest.two{font-size:16px}}
</style>

<script src="./hdr.js?v=20261021"></script>
<script>hslChrome('./about.html')</script>
<div class="demo" id="demo" hidden>プレビュー用のサンプルデータを表示しています（公開環境では公式データに自動で切り替わります）</div>
<section class="phead"><div class="wrap">
  <div class="crumb"><a href="./">ホーム</a> ／ 連盟について</div>
  <div class="eyebrow">ABOUT</div><h1>連盟について</h1>
</div></section>
<main class="wrap main"><nav class="pills jump" id="jump" aria-label="このページの中"></nav><div id="main"><span class="sk"></span><span class="sk"></span></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has=v=>v!=null&&String(v).trim()!=='';
const PARAMS=new URLSearchParams(location.search);
let DEMO=PARAMS.has('demo');
const WD=['日','月','火','水','木','金','土'];
function fmtDate(s){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');if(!m)return s||'';return m[1]+'.'+m[2]+'.'+m[3]+'（'+WD[new Date(+m[1],+m[2]-1,+m[3]).getDay()]+'）'}
const safeUrl=u=>/^https?:\/\//i.test(String(u||''))?String(u):'';
/* 本文：改行を保ち、URLをリンクにする */
function richText(t){return esc(t).replace(/(https?:\/\/[^\s<>"']+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>')}
const shortComp=n=>String(n||'').replace(/^\d{4}年度\s*/,'').replace(/第\d+回\s*/g,'').replace(/^北海道サッカーリーグ$/,'北海道リーグ').replace(/^北海道サッカーリーグ\s*(?=\S)/,'').replace(/ブロックリーグ決勝大会/,'決勝大会').replace(/ブロックリーグ$/,'ブロック').replace(/^(全国社会人|全国クラブ).*$/,'$1予選').replace(/^北海道サッカー選手権.*$/,'北海道選手権').trim()||n;
async function getJSON(file){
  if(DEMO)return demoData(file);
  const r=await fetch('../results/data/'+file,{cache:'no-store'});
  if(!r.ok)throw Error('HTTP '+r.status);
  return r.json();
}
async function boot(file,fn){
  let d;
  try{d=await getJSON(file)}
  catch(e){
    if(!/github\.io$/.test(location.hostname)){DEMO=true;d=await getJSON(file)}
    else{fn(null,e);return}
  }
  $('demo').hidden=!DEMO;
  if(d?.updatedAt){/* フッター（hdr.js）はページを読み終えてから入るので、まだなければ待つ */
    const put=()=>{const u=$('updated');if(u)u.textContent='最終更新 '+String(d.updatedAt).replace('T',' ').slice(0,16)};
    if($('updated'))put();else document.addEventListener('DOMContentLoaded',put);}
  fn(d);
}

const PALETTE=['var(--draw)'];  // チームの色が入っていないときの台の色（DESIGN.md の色だけ。トップの site.js と同じ）
function emblemUrl(e){
  e=String(e||'').trim();if(!e)return '';
  const d=e.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/);
  if(d)return 'https://drive.google.com/thumbnail?id='+d[1]+'&sz=w400';
  if(/^https:\/\//i.test(e))return e;
  if(/^[^\/\\?#]+\.(png|jpe?g|webp|svg|gif)$/i.test(e))return './emblems/'+encodeURIComponent(e);
  return '';
}
/* 写真：ドライブの共有リンクは縮小版（幅 w px）にする。https の画像URLはそのまま */
function photoUrl(u,w){
  u=String(u||'').trim();if(!u)return '';
  const d=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/);
  if(d)return 'https://drive.google.com/thumbnail?id='+d[1]+'&sz=w'+w;
  if(/^https:\/\//i.test(u))return u;
  return '';
}
const photoSet=(u,ws)=>/drive\.google\.com\/thumbnail/.test(photoUrl(u,ws[0]))?ws.map(w=>photoUrl(u,w)+' '+w+'w').join(', '):'';
function cover(t){
  const c=(crest(t).match(/--c:([^;"]+)/)||[])[1]||'var(--draw)',ph=photoUrl(t.teamPhoto,600),set=photoSet(t.teamPhoto,[400,600,900]);
  return ph?'<span class="cv photo" style="--c:'+c+'"><img src="'+esc(ph)+'"'+(set?' srcset="'+esc(set)+'" sizes="(max-width:680px) 50vw, 230px"':'')+' alt="" loading="lazy" decoding="async" onerror="this.parentNode.classList.remove(\'photo\');this.remove()"></span>':'<span class="cv" style="--c:'+c+'"></span>';
}
/* クラブのエンブレム：new/emblems/index.json（{"クラブ名":"ファイル名"}）。チーム紹介の「エンブレム」が空のときに使う */
let EMB={};
const embReady=fetch('./emblems/index.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).then(j=>{EMB=j&&typeof j==='object'?j:{}}).catch(()=>{});
function embFor(...names){for(const n of names){const f=n&&EMB[String(n).trim()];if(f&&/^[^\/\\?#]+\.(png|jpe?g|webp|svg|gif)$/i.test(f))return './emblems/'+encodeURIComponent(f)}return ''}
function crestFail(img){const s=img.parentNode;if(img.classList.contains('ed')){s.classList.remove('hasdark');img.remove();return}s.classList.remove('img','hasdark');s.querySelectorAll('img').forEach(x=>x.remove());s.insertBefore(document.createTextNode(s.dataset.ch),s.firstChild)}
/* 案①：同じ見た目（同じエンブレム・同じ文字）のチームが並ぶときだけ、名前の違う部分を小さな札にして付ける */
const BADGE=new Map();
const BADGE_WORDS={'セカンド':'2nd','サテライト':'SAT','サード':'3rd','トップ':'TOP'};
function makeBadges(teams,keyOf,labelOf){
  BADGE.clear();
  const g=new Map();
  for(const t of teams){
    const h=crestBase(t),u=(h.match(/<img[^>]*? src="([^"]+)"/)||[])[1];
    const look=u||'txt:'+((h.match(/>([^<]*)<\/span>$/)||[])[1]||'');
    if(!g.has(look))g.set(look,[]);g.get(look).push(t);
  }
  const tok=c=>/[0-9A-Za-z\-－]/.test(c||'');
  for(const ts of g.values()){
    if(ts.length<2)continue;
    const ns=ts.map(t=>[...String(labelOf(t)||'')]),min=Math.min(...ns.map(n=>n.length));
    let p=0;while(p<min&&ns.every(n=>n[p]===ns[0][p]))p++;
    while(p>0&&tok(ns[0][p-1])&&ns.some(n=>tok(n[p])))p--;
    let s=0;while(s<min-p&&ns.every(n=>n[n.length-1-s]===ns[0][ns[0].length-1-s]))s++;
    while(s>0&&ns.some(n=>tok(n[n.length-1-s]))&&tok(ns[0][ns[0].length-s]))s--;
    let out=ns.map(n=>{let x=n.slice(p,n.length-s).join('').replace(/[-－\s]/g,'');x=BADGE_WORDS[x]||x;return [...x].slice(0,3).join('')});
    if(out.some(x=>!x)||new Set(out).size<out.length)out=ts.map((_,i)=>String.fromCharCode(65+i));
    ts.forEach((t,i)=>BADGE.set(keyOf(t),out[i]));
  }
}
function addBadge(html,key){const b=BADGE.get(key);return b?html.replace(/<\/span>$/,'<i class="bdg">'+esc(b)+'</i></span>'):html}
function crest(t){return addBadge(crestBase(t),t.id)}
function crestInk(c){const m=/^#?([0-9a-f]{6})$/i.exec(String(c||''));if(!m)return '#fff';/* 台が --draw のときは白（DESIGN.md の「分」と同じ組み合わせ） */const n=parseInt(m[1],16),L=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*L[0]+.7152*L[1]+.0722*L[2]>.45?'var(--navy)':'#fff'}
function crestBase(t){
  const n=t.short||t.name||'';let h=0;for(const ch of String(t.id||n))h=(h*31+ch.charCodeAt(0))>>>0;
  let s=n.replace(/^(北海道|国立|私立)/,'').replace(/(クラブ|大)$/,'');if(![...s].length)s=n.replace(/クラブ$/,'大');
  const ch=[...s].slice(0,2).join('')||'?',two=[...ch].length>1;
  const c=/^#[0-9a-f]{3,8}$/i.test(t.color||'')?t.color:PALETTE[h%PALETTE.length],u=emblemUrl(t.emblem)||embFor(t.univ,t.name,t.short);
  if(u)return '<span class="crest img'+(two?' two':'')+'" style="--c:'+c+';color:'+crestInk(c)+'" data-ch="'+esc(ch)+'"><img src="'+esc(u)+'" alt="" loading="lazy" onerror="crestFail(this)"></span>';
  return '<span class="crest'+(two?' two':'')+'" style="--c:'+c+';color:'+crestInk(c)+'">'+esc(ch)+'</span>';
}
const sec=(id,en,ja,inner)=>'<section class="sec" id="'+id+'"><div class="sech"><h2><small>'+en+'</small>'+ja+'</h2></div>'+inner+'</section>';
boot('about.json',async(d)=>{
  await embReady;
  if(!d){$('main').innerHTML='<p class="empty">連盟の情報を読み込めませんでした。</p>';return}
  const parts=[];
  if(d.overview?.length)parts.push(['overview','OVERVIEW','連盟概要','<div class="ov">'+d.overview.map(o=>{const u=safeUrl(o.url);return '<article class="card"><h3>'+esc(o.title)+'</h3>'+(has(o.body)?'<p>'+richText(o.body)+'</p>':'')+(u?'<a class="lk" href="'+esc(u)+'" target="_blank" rel="noopener">詳しく見る ↗</a>':'')+'</article>'}).join('')+'</div>']);
  if(d.members?.length){
    const total=new Set(d.members.flatMap(l=>l.teams.map(t=>t.univ||t.name))).size;
    parts.push(['members','MEMBERS','加盟チーム','<p class="note" style="margin:-4px 0 12px">'+total+'クラブ（今年度のリーグ戦の登録チーム）</p>'+d.members.map(l=>(makeBadges(l.teams,t=>t.id,t=>t.short||t.name),'')+'<div class="league"><h3>'+esc(shortComp(l.name))+'<span>'+l.teams.length+'チーム</span></h3><div class="clubs">'+
      l.teams.map(t=>'<a class="club" href="./team.html?comp='+encodeURIComponent(l.comp)+'&team='+encodeURIComponent(t.id)+'">'+cover(t)+crest(t)+'<div><strong>'+esc(t.name||t.short)+'</strong></div></a>').join('')+'</div></div>').join('')]);
  }
  const fileRow=o=>{const u=safeUrl(o.url),pdf=/\.pdf(\?|$)/i.test(u),tag=u?'a':'div';
    return '<'+tag+(u?' href="'+esc(u)+'" target="_blank" rel="noopener"':'')+'><span class="ic'+(pdf?' pdf':'')+'">'+(pdf?'PDF':u?'LINK':'INFO')+'</span><span><b>'+esc(o.title)+'</b>'+(has(o.body)?'<small>'+richText(o.body)+'</small>':'')+'</span>'+(u?'<span class="go">開く ↗</span>':'')+'</'+tag+'>'};
  if(d.documents?.length)parts.push(['documents','DOCUMENTS','書類・様式','<div class="card docs">'+d.documents.map(fileRow).join('')+'</div>']);
  if(d.links?.length)parts.push(['links','LINKS','関連リンク','<div class="card docs">'+d.links.map(fileRow).join('')+'</div>']);
  if(d.contact?.length)parts.push(['contact','CONTACT','お問い合わせ','<div class="card ct">'+d.contact.map(o=>{const u=safeUrl(o.url);return '<div><h3>'+esc(o.title)+'</h3>'+(has(o.body)?'<p>'+richText(o.body)+'</p>':'')+(u?'<a class="btn main" href="'+esc(u)+'" target="_blank" rel="noopener">'+(/forms\.gle|docs\.google\.com\/forms/.test(u)?'フォームを開く':'開く')+' ↗</a>':'')+'</div>'}).join('')+'</div>']);
  if(!parts.length){$('main').innerHTML='<p class="empty">連盟の情報は準備中です。</p>';return}
  $('jump').innerHTML=parts.map(p=>'<a href="#'+p[0]+'">'+p[2]+'</a>').join('');
  $('main').innerHTML=parts.map(p=>sec(...p)).join('');
});
function demoData(){
  const T=n=>'ABCDEFGH'.slice(0,n).split('').map((c,i)=>({id:'t'+i,short:'サンプル大'+c,univ:'サンプルクラブ'+c}));
  return {ok:true,updatedAt:new Date().toISOString(),
    overview:[{title:'（サンプル）連盟について',body:'（サンプル）ここに連盟の目的や沿革が入ります。\n「連盟ページ」シートの「概要」に書いた内容がそのまま表示されます。',url:''},{title:'（サンプル）組織・役員',body:'（サンプル）会長・理事長・各委員会など',url:''}],
    members:[{comp:'demo-1',name:'【サンプル】リーグ 1部',teams:T(8)},{comp:'demo-2',name:'【サンプル】リーグ 2部',teams:T(6).map(t=>({...t,id:t.id+'b',short:t.short+'2'}))}],
    documents:[{title:'（サンプル）チーム登録申請書',body:'毎年4月末まで',url:'https://example.com/a.pdf'},{title:'（サンプル）大会要項',body:'',url:'https://example.com'}],
    links:[{title:'（サンプル）全日本クラブサッカー連盟',body:'',url:'https://example.com'}],
    contact:[{title:'お問い合わせ',body:'（サンプル）お問い合わせはフォームからお願いします。',url:'https://forms.gle/example'}]};
}

</script>
