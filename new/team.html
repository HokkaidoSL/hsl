<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08121d">
<link rel="icon" href="./img/hsl-logo.svg" type="image/svg+xml">
<meta name="robots" content="noindex,nofollow">
<title>チーム紹介 | 北海道サッカーリーグ</title>
<meta name="description" content="北海道サッカーリーグのクラブの紹介・選手名鑑・試合結果">
<meta property="og:type" content="website">
<meta property="og:site_name" content="北海道サッカーリーグ">
<meta property="og:title" content="チーム紹介 | 北海道サッカーリーグ">
<meta property="og:description" content="北海道サッカーリーグのクラブの紹介・選手名鑑・試合結果">
<meta property="og:url" content="https://hokkaidosl.github.io/hsl/new/team.html">
<meta property="og:image" content="https://hokkaidosl.github.io/hsl/new/img/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./hsl.css?v=20261021">
<style>
/* クラブのページだけの部品（色・影・角丸は hsl.css の変数だけ。--team はクラブの登録色で、アクセントとエンブレムの代わりの丸だけに使う） */
:root{--team:var(--logo-b)}
.demo{background:var(--card2);color:var(--ink);font-size:12px;text-align:center;padding:8px 16px}
.card{overflow:hidden}

/* クラブのエンブレムの列 */
.clubbar{display:flex;align-items:center;gap:4px;margin-top:16px;overflow-x:auto;scrollbar-width:none;padding:2px}
.clubbar::-webkit-scrollbar{display:none}
.clubbar small{font:700 12px/1 var(--num);letter-spacing:.12em;color:var(--logo-b);margin-right:8px;white-space:nowrap}
.clubbar a{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;opacity:.6;transition:opacity .15s}
.clubbar a:hover{opacity:1}
.clubbar a.on{opacity:1;box-shadow:inset 0 0 0 2px var(--ink)}

/* 大会のタブ（ピル型の切り替え） */
.comptabs{margin-top:12px;display:flex}
.comptabs .bar{display:flex;gap:2px;padding:4px;background:var(--card);border-radius:var(--r-pill);box-shadow:var(--shadow-card);overflow-x:auto;scrollbar-width:none;max-width:100%}
.comptabs .bar::-webkit-scrollbar{display:none}
.comptabs button{flex:none;border:0;background:transparent;color:var(--ink);padding:0 16px;min-height:40px;border-radius:var(--r-pill);font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer}
.comptabs button:hover{background:var(--card2)}
.comptabs button[aria-selected=true]{background:var(--ink);color:var(--navy)}
@media(max-width:600px){.comptabs button{min-height:44px}}

/* エンブレム（hsl.css の .crest に、このページの大きさと札を足す） */
.crest{position:relative;width:40px;height:40px;font-size:14px;padding:0;background:var(--c,var(--draw))}
.crest .bdg{position:absolute;right:-6px;bottom:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:var(--r-pill);background:var(--logo-y);color:var(--navy);font:800 12px/18px var(--num);font-style:normal;letter-spacing:0;text-align:center;white-space:nowrap;box-shadow:0 0 0 1.5px var(--bg)}
.crest.xs .bdg{display:none}
.crest.xl .bdg{min-width:28px;height:24px;padding:0 7px;font-size:15px;line-height:24px;right:-8px;bottom:-2px}
.crest.xs{width:24px;height:24px;font-size:12px;padding:0}
.crest.sm{width:30px;height:30px;font-size:12px}
.crest.xl{width:96px;height:96px;font-size:36px}
.crest.two{letter-spacing:-.05em}
.crest.xl.two{font-size:30px}
/* 暗い地の上のエンブレム：白い版（チーム紹介「エンブレム（暗い背景用）」）があればそれ、なければ白い丸い台にのせる */
.crest.img{padding:0}
.crest.img img{width:100%;height:100%;object-fit:contain;display:block}
.crest.img .ed{display:none}
.crest.img.hasdark{background:transparent;border-radius:0;overflow:visible}
.crest.img.hasdark .el{display:none}
.crest.img.hasdark .ed{display:block}
.crest.img:not(.hasdark){background:#fff;border-radius:50%}
.crest.img:not(.hasdark) img{position:absolute;inset:15%;width:70%;height:70%}

/* クラブの見出し */
.hero{margin-top:16px;position:relative;overflow:hidden;background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-card)}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--team);z-index:2}
.hero .in{position:relative;z-index:1;padding:24px 24px 28px}
/* チーム写真（ホームページ管理画面の「チーム紹介」→「チーム写真」）：見出しの後ろに暗くして敷く */
.hero .hph{position:absolute;inset:0;z-index:0}
.hero .hph img{width:100%;height:100%;object-fit:cover;object-position:center 35%}
.hero .hph:after{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--card) 84%,transparent)}
.crumb{font-size:12px;color:var(--muted);margin-bottom:16px}
.crumb a{color:var(--logo-b)}
.crumb a:hover{text-decoration:underline}
.club-id{display:flex;align-items:center;gap:24px}
.club-id>div{min-width:0}
.club-id h1{font-size:32px;margin:4px 0 6px;line-height:1.3;font-weight:900}
.club-id p{margin:0;font-size:14px;color:var(--muted)}
.eyebrow{font:700 12px/1 var(--num);letter-spacing:.12em;color:var(--logo-b)}
.hstats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:24px;border-top:1px solid var(--line)}
.hstat{padding:14px 4px 2px;min-width:0}
.hstat+.hstat{border-left:1px solid var(--line);padding-left:16px}
.hstat b{display:block;font-family:var(--num);font-size:34px;font-weight:700;line-height:1}
.hstat b small{font-size:16px;color:var(--muted);margin-left:2px}
.hstat span{font-size:12px;color:var(--muted)}
.form{display:flex;gap:4px;margin:2px 0 4px}
.form i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:900}
.form i.W{background:var(--logo-g);color:var(--navy)}.form i.D{background:var(--draw);color:#fff}.form i.L{background:var(--red-bg);color:#fff}
.form i.E{background:var(--card2);color:var(--muted)}

/* 並べ方 */
.main{padding-bottom:16px}
.section{margin-top:48px}
.main>.section:first-child{margin-top:24px}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.sechead h2{margin:0;font-size:24px;font-weight:900;line-height:1.3}
.sechead h2 small{display:block;font:700 12px/1 var(--num);letter-spacing:.12em;color:var(--logo-b);margin-bottom:6px}
.sechead>a{font-size:14px;color:var(--logo-b);font-weight:700;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center}
.sechead>a:after{content:" »";margin-left:4px}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:24px}
.cols>*{min-width:0}
.side{display:grid;gap:32px;align-content:start;min-width:0}
.empty{line-height:1.8}
.note{margin:8px 2px 0}
#schedule,#record,#players,#about{scroll-margin-top:16px}

/* 次の試合・前の試合 */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.mcard.next{box-shadow:inset 0 3px 0 var(--logo-y),var(--shadow-card)}
a.mcard:hover{background:var(--card2)}
.mcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.mcard .top>span:last-child{display:inline-flex;align-items:center;gap:8px}
.lbl{font:700 12px/1.5 var(--num);letter-spacing:.12em;padding:2px 10px;border-radius:var(--r-pill);background:var(--card2);color:var(--ink)}
.mcard.next .lbl{background:var(--logo-y);color:var(--navy)}
.duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.duel .t{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:14px;font-weight:700;min-width:0}
.duel .t span:not(.crest){max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duel .t.me span:not(.crest){font-weight:900}
.duel .c{text-align:center;min-width:76px}
.duel .c b{display:block;font-family:var(--num);font-size:36px;font-weight:800;line-height:1}
.duel .c .vs{color:var(--muted);font-size:24px}
.duel .c small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.res.W{background:var(--logo-g);color:var(--navy)}.res.D{background:var(--draw);color:#fff}.res.L{background:var(--red-bg);color:#fff}
.mcard .foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd{font-family:var(--num);color:var(--logo-y);font-weight:700;font-size:15px;letter-spacing:.04em;margin-top:2px}

/* 日程・結果 */
.tabs{display:inline-flex;background:var(--card);border-radius:var(--r-pill);box-shadow:var(--shadow-card);padding:4px;gap:2px;flex:none}
.tabs button{border:0;background:transparent;padding:0 16px;min-height:40px;border-radius:var(--r-pill);font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--navy)}
@media(max-width:600px){.tabs button{min-height:44px}}
.mrow{display:grid;grid-template-columns:78px 52px minmax(0,1fr) 74px 32px;align-items:center;gap:10px;padding:12px 16px;min-height:60px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow:hover{background:var(--card2)}
.mrow .d{font-family:var(--num);font-size:17px;font-weight:700;line-height:1.1;min-width:0}
.mrow .d small{display:block;font-family:"Noto Sans JP",sans-serif;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ha{font:700 13px/1 var(--num);letter-spacing:.04em;text-align:center;border:1px solid var(--line);border-radius:var(--r-pill);padding:4px 0;color:var(--muted)}
.ha.H{background:var(--logo-b);color:var(--navy);border-color:var(--logo-b)}
.ha:empty{border:0}
.noha .mrow{grid-template-columns:78px minmax(0,1fr) 74px 32px}
.noha .ha{display:none}
.opp{display:flex;align-items:center;gap:10px;min-width:0;font-size:14px;font-weight:700}
.opp span:not(.crest){display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp small{display:block;font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp div{min-width:0}
.mrow .sc{text-align:center;font-family:var(--num);font-size:22px;font-weight:700;white-space:nowrap}
.mrow .sc.vs{font-size:14px;color:var(--muted);letter-spacing:.08em;font-weight:600}
.mrow .r{display:flex;justify-content:flex-end}

/* 表 */
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:10px 8px;text-align:center;white-space:nowrap;border-top:1px solid var(--line)}
th{background:var(--card2);color:var(--muted);font-size:12px;font-weight:700;border-top:0}
th.l,td.l{text-align:left}
td.n{font-family:var(--num);font-size:16px;font-weight:700}
td.pts{font-family:var(--num);font-size:18px;font-weight:800}
tr.me td{background:var(--card2)}
tr.me td:first-child{box-shadow:inset 4px 0 0 var(--team)}
.pos{font-family:var(--num);font-weight:700;font-size:16px}
.tt{display:flex;align-items:center;gap:8px;font-weight:700}
.tbl-foot{display:flex;align-items:center;justify-content:center;min-height:44px;font-size:13px;color:var(--logo-b);font-weight:700;padding:8px;border-top:1px solid var(--line)}
.tbl-foot:hover{background:var(--card2)}

/* チーム内得点 */
.scorer{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line)}
.scorer:first-child{border-top:0}
.scorer .rk{font-family:var(--num);font-size:18px;font-weight:700;color:var(--muted);text-align:center}
.scorer .who b{display:block;font-size:14px}
.scorer .who small{font-size:12px;color:var(--muted)}
.scorer .g{font-family:var(--num);font-size:24px;font-weight:800;line-height:1}
.scorer .g small{font-family:"Noto Sans JP",sans-serif;font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}

/* シーズン成績 */
.rec{display:grid;grid-template-columns:repeat(4,1fr)}
.rec div{padding:16px 8px;text-align:center;border-left:1px solid var(--line);border-top:1px solid var(--line)}
.rec div:nth-child(4n+1){border-left:0}
.rec div:nth-child(-n+4){border-top:0}
.rec b{display:block;font-family:var(--num);font-size:30px;font-weight:700;line-height:1.1}
.rec span{font-size:12px;color:var(--muted)}
.wdl{display:flex;height:8px;border-radius:var(--r-pill);overflow:hidden;margin:0 16px 16px;background:var(--card2)}
.wdl i{display:block}
.wdl .w{background:var(--logo-g)}.wdl .d{background:var(--draw)}.wdl .l{background:var(--red-bg)}

/* クラブ情報 */
.about{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
.intro{padding:16px 20px;font-size:15px;line-height:2;white-space:pre-wrap}
dl.facts{margin:0}
dl.facts div{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:12px 16px;border-top:1px solid var(--line);font-size:14px}
dl.facts div:first-child{border-top:0}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.links a{font-size:13px;font-weight:700;background:var(--card2);color:var(--ink);padding:0 16px;min-height:44px;display:inline-flex;align-items:center;border-radius:var(--r-pill)}
.links a:hover{color:var(--logo-b)}
.links a.clubsite{background:var(--logo-y);color:var(--navy)}
.links a.clubsite:hover{color:var(--navy)}
.pending{border:1.5px dashed var(--line);background:var(--card);border-radius:var(--r-card);padding:24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.9}
.pending b{display:block;color:var(--ink);font-size:16px}

/* 選手名鑑 */
.ptabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding:2px}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{flex:none;border:0;background:var(--card2);padding:0 16px;min-height:44px;border-radius:var(--r-pill);font-size:14px;font-weight:700;color:var(--ink);display:flex;gap:6px;align-items:center;cursor:pointer}
.ptabs button span{font-family:var(--num);font-size:14px;color:var(--muted)}
.ptabs button[aria-selected=true]{background:var(--ink);color:var(--navy)}
.ptabs button[aria-selected=true] span{color:var(--navy)}
.card.sq-wrap{overflow-x:auto}
.sq{font-size:13px}
.sq th{padding:10px 8px;white-space:nowrap}
.sq th small{font-size:12px;font-weight:500;margin-left:1px}
.sq td{padding:10px 8px}
.sq tbody tr:not(.grp):hover td{background:var(--card2)}
.sq td.no{font-family:var(--num);font-size:20px;font-weight:800;color:var(--teamText,var(--ink));width:52px;text-align:center}
.sq .pp{font-family:var(--num);font-weight:700;color:var(--muted);width:40px;font-size:13px}
.sq td.nm{text-align:left;white-space:normal;min-width:120px}
.sq td.nm b{font-size:14px}
.sq td.nm small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.sq td.nm small.sp{display:none}
.sq td.sch{max-width:180px;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--muted)}
.sq td.pc{font-size:12px;color:var(--muted)}
.sq td.n{font-family:var(--num);font-size:16px;font-weight:700;width:56px}
.sq td.n small{font-size:12px;color:var(--muted);margin-left:2px}
.sq td.g{font-weight:800;color:var(--ink)}
.sq .z{color:var(--muted);font-weight:400}
.sq td.cd i{display:inline-block;font-style:normal;font-family:var(--num);font-size:12px;width:16px;height:20px;line-height:20px;border-radius:2px;margin:0 1px;font-weight:800}
.sq td.cd i.yc{background:var(--logo-y);color:var(--navy)}.sq td.cd i.rc{background:var(--red-bg);color:#fff}
.sq tr.grp td{background:var(--card);text-align:left;font-family:var(--num);font-weight:800;font-size:16px;letter-spacing:.1em;padding:16px 12px 6px;border-top:1px solid var(--line);color:var(--logo-b)}
.sq tr.grp td span{font-family:"Noto Sans JP",sans-serif;font-size:12px;font-weight:500;letter-spacing:0;color:var(--muted);margin-left:4px}
.sq tr.grp:first-child td{padding-top:12px;border-top:0}
.plink{color:inherit;border-bottom:1px dotted var(--muted)}
.plink:hover{color:var(--logo-b);border-bottom-color:var(--logo-b)}

/* クラブニュース */
.news a{display:flex;gap:12px;padding:12px 16px;min-height:44px;border-top:1px solid var(--line);font-size:14px;font-weight:700;align-items:baseline}
.news a:first-child{border-top:0}
.news a[href]:hover{background:var(--card2)}
.news a[href]:hover span{color:var(--logo-b)}
.news time{flex:none;font-family:var(--num);font-size:14px;color:var(--muted);font-weight:600}

/* カレンダーに入れる */
.calbox{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.calbox[hidden]{display:none}
.calbox .cl{font-weight:700;color:var(--ink)}
.calbox a{padding:0 16px;min-height:44px;display:inline-flex;align-items:center;background:var(--card2);border-radius:var(--r-pill);color:var(--ink);font-weight:700;font-size:13px}
.calbox a:hover{color:var(--logo-b)}
.calbox small{flex-basis:100%;color:var(--muted);font-size:12px}
.calbox .calsel{max-width:100%;font:inherit;font-size:13px;padding:0 12px;min-height:44px;border-radius:var(--r-pill);border:0;background:var(--card2);color:var(--ink)}
.calbox .calone{font-size:13px;color:var(--muted)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:920px){
  .cols,.about{grid-template-columns:minmax(0,1fr)}
  .side{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
}
@media(max-width:680px){
  .clubbar small{display:none}
  .hero .in{padding:16px 16px 20px}
  .crumb{margin-bottom:12px}
  .club-id{gap:16px}
  .club-id h1{font-size:24px}
  .crest.xl{width:64px;height:64px;font-size:24px}
  .crest.xl.two{font-size:20px}
  .club-id p{font-size:13px}
  .hstats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hstat:nth-child(4){border-left:0;padding-left:4px}
  .hstat+.hstat{padding-left:12px}
  .hstat:nth-child(5){grid-column:span 2}
  .hstat b{font-size:28px}
  .section{margin-top:32px}
  .pair{grid-template-columns:minmax(0,1fr)}
  .sechead h2{font-size:20px}
  /* 5つの部分（日付・HOME/AWAY・相手・スコア・勝敗）はスマホでも横に並べる */
  .mrow{grid-template-columns:44px 44px minmax(0,1fr) 50px 26px;gap:6px;padding:10px 12px}
  .noha .mrow{grid-template-columns:44px minmax(0,1fr) 50px 26px}
  .mrow .d{font-size:16px}
  .mrow .d small{white-space:normal;overflow:visible;line-height:1.3}
  .ha{font-size:12px;letter-spacing:0}
  .mrow .sc{font-size:19px}
  .mrow .sc.vs{font-size:13px}
  .mrow .res{width:24px;height:24px}
  .opp{font-size:13px}
  .opp .crest{display:none}
  .side{grid-template-columns:minmax(0,1fr);gap:32px}
  .rec b{font-size:26px}

<script src="./season.js?v=20261012c"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* カレンダーに入れる：../results/data/cal/*.ics（全体システムが書き出す）。ファイルがあるときだけ出す */
function calBox(el,choices,title){
  if(!el||!choices.length)return;
  const url=f=>new URL('../results/data/cal/'+f,location.href).href;
  fetch(url(choices[0].file),{method:'HEAD',cache:'no-store'}).then(r=>{if(!r.ok)return;
    el.innerHTML='<span class="cl">📅 '+esc(title)+'</span>'+(choices.length>1?'<select class="calsel" aria-label="カレンダーに入れる日程">'+choices.map((c,i)=>'<option value="'+i+'">'+esc(c.label)+'</option>').join('')+'</select>':'<span class="calone">'+esc(choices[0].label)+'</span>')+
      '<a class="cal-ios" href="#">iPhone・Mac</a><a class="cal-g" href="#" target="_blank" rel="noopener">Googleカレンダー</a><small>登録すると、日程や会場が変わったときもカレンダーが自動で変わります（反映まで数時間かかることがあります）</small>';
    const set=i=>{const w=url(choices[i].file).replace(/^https?:/,'webcal:');el.querySelector('.cal-ios').href=w;el.querySelector('.cal-g').href='https://calendar.google.com/calendar/r?cid='+encodeURIComponent(w);};
    const sel=el.querySelector('.calsel');if(sel)sel.onchange=()=>set(+sel.value);
    set(0);el.hidden=false;}).catch(()=>{});
}
const name=t=>typeof t==='string'?t:(t?.short||t?.name||'未定');
const fullName=t=>typeof t==='string'?t:(t?.name||t?.short||'未定');
const tkey=t=>typeof t==='string'?t:(t?.id||t?.name||t?.short||'');
const detail=(id,mid)=>'./results.html?comp='+encodeURIComponent(id)+(mid?'&match='+encodeURIComponent(mid):'');
const jstToday=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const pick=(o,ks)=>{for(const k of ks)if(o?.[k]!=null&&o[k]!=='')return o[k];return null};
const isDone=m=>m.status==='finished'&&m.score&&m.score.home!=null&&m.score.home!==''&&m.score.away!=null&&m.score.away!=='';
const has=v=>v!=null&&String(v).trim()!=='';
const PARAMS=new URLSearchParams(location.search);
let DEMO=PARAMS.has('demo');
const teamUrl=(comp,t)=>'./team.html?'+(comp&&comp!=='ALL'?'comp='+encodeURIComponent(comp)+'&':'')+'team='+encodeURIComponent(tkey(t))+(DEMO?'&demo':'');

const PALETTE=['#145ec9','#0f7a6b','#7b3fb5','#c0392b','#1d6fa5','#b35c00','#2e7d32','#ad1457','#37474f','#5d4dbf'];
let PROFILES=[];
function teamColor(t){const p=profileOf(t);if(p&&/^#[0-9a-f]{3,8}$/i.test(p.color||''))return p.color;let h=0;for(const ch of tkey(t))h=(h*31+ch.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]}
/* 案①：同じ見た目（同じエンブレム・同じ文字）のチームが並ぶときだけ、名前の違う部分を小さな札にして付ける */
const BADGE=new Map();
const BADGE_WORDS={'セカンド':'2nd','サテライト':'SAT','サード':'3rd','トップ':'TOP'};
function makeBadges(teams,keyOf,labelOf){
  BADGE.clear();
  const g=new Map();
  for(const t of teams){
    const h=crestBase(t),u=(h.match(/<img[^>]*? src="([^"]+)"/)||[])[1];
    const look=u||'txt:'+((h.match(/>([^<]*)<\/span>$/)||[])[1]||'');
    if(!g.has(look))g.set(look,[]);g.get(look).push(t);
  }
  const tok=c=>/[0-9A-Za-z\-－]/.test(c||'');
  for(const ts of g.values()){
    if(ts.length<2)continue;
    const ns=ts.map(t=>[...String(labelOf(t)||'')]),min=Math.min(...ns.map(n=>n.length));
    let p=0;while(p<min&&ns.every(n=>n[p]===ns[0][p]))p++;
    while(p>0&&tok(ns[0][p-1])&&ns.some(n=>tok(n[p])))p--;
    let s=0;while(s<min-p&&ns.every(n=>n[n.length-1-s]===ns[0][ns[0].length-1-s]))s++;
    while(s>0&&ns.some(n=>tok(n[n.length-1-s]))&&tok(ns[0][ns[0].length-s]))s--;
    let out=ns.map(n=>{let x=n.slice(p,n.length-s).join('').replace(/[-－\s]/g,'');x=BADGE_WORDS[x]||x;return [...x].slice(0,3).join('')});
    if(out.some(x=>!x)||new Set(out).size<out.length)out=ts.map((_,i)=>String.fromCharCode(65+i));
    ts.forEach((t,i)=>BADGE.set(keyOf(t),out[i]));
  }
}
function addBadge(html,key){const b=BADGE.get(key);return b?html.replace(/<\/span>$/,'<i class="bdg">'+esc(b)+'</i></span>'):html}
function crest(t,size){return addBadge(crestBase(t,size),tkey(t))}
function crestInk(c){const m=/^#?([0-9a-f]{6})$/i.exec(String(c||''));if(!m)return '#fff';const n=parseInt(m[1],16),L=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*L[0]+.7152*L[1]+.0722*L[2]>.45?'var(--navy)':'#fff'}
function crestBase(t,size){
  const n=name(t);
  let s=n.replace(/^(北海道|国立|私立)/,'').replace(/(クラブ|大)$/,'');
  if(![...s].length)s=n.replace(/クラブ$/,'大');
  const ch=[...s].slice(0,2).join('')||'?',two=[...ch].length>1;
  const u=emblemUrl(profileOf(t))||embFor(typeof t==='object'?t.univ:'',name(t),typeof t==='object'?t.name:'');
  const ud=emblemUrl({emblem:profileOf(t)?.emblemDark});
  if(u)return '<span class="crest img '+(size||'')+(two?' two':'')+(ud?' hasdark':'')+'" style="--c:'+teamColor(t)+';color:'+crestInk(teamColor(t))+'" data-ch="'+esc(ch)+'"><img class="el" src="'+esc(u)+'" alt="'+esc(name(t))+'" loading="lazy" onerror="crestFail(this)">'+(ud?'<img class="ed" src="'+esc(ud)+'" alt="'+esc(name(t))+'" loading="lazy" onerror="crestFail(this)">':'')+'</span>';
  return '<span class="crest '+(size||'')+(two?' two':'')+'" style="--c:'+teamColor(t)+';color:'+crestInk(teamColor(t))+'" aria-hidden="true">'+esc(ch)+'</span>';
}

/* エンブレム画像：チーム紹介シートの「エンブレム」列（new/emblems/ のファイル名、または画像URL） */
function emblemUrl(p){
  const e=String(p?.emblem||'').trim();if(!e)return '';
  const d=e.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/);
  if(d)return 'https://drive.google.com/thumbnail?id='+d[1]+'&sz=w400';
  if(/^https:\/\//i.test(e))return e;
  if(/^[^\/\\?#]+\.(png|jpe?g|webp|svg|gif)$/i.test(e))return './emblems/'+encodeURIComponent(e);
  return '';
}
/* チーム写真：ドライブの共有リンクは縮小版にする */
function teamPhotoUrl(p,w){
  const e=String(p?.teamPhoto||'').trim();if(!e)return '';
  const d=e.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/);
  if(d)return 'https://drive.google.com/thumbnail?id='+d[1]+'&sz=w'+w;
  if(/^[^\/\\?#]+\.(png|jpe?g|webp)$/i.test(e))return './photos/'+encodeURIComponent(e);
  return /^https:\/\//i.test(e)?e:'';
}
/* 手で置いたチーム写真：new/photos/index.json の teams（{"クラブの正式名":"ファイル名"}）。チーム紹介の「チーム写真」が空のときに使う */
let PHI={};
const phReady=fetch('./photos/index.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).then(j=>{PHI=j&&typeof j==='object'?j:{}}).catch(()=>{});
function manualTeamPhoto(t){const m=PHI.teams||{};if(typeof t!=='object')return '';for(const k of [t.name,t.univ,t.id]){const f=k&&m[k];if(f&&/^[^\/\\?#]+\.(png|jpe?g|webp)$/i.test(f))return './photos/'+encodeURIComponent(f)}return ''}
/* クラブのエンブレム：new/emblems/index.json（{"クラブ名":"ファイル名"}）。チーム紹介の「エンブレム」が空のときに使う */
let EMB={};
const embReady=fetch('./emblems/index.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).then(j=>{EMB=j&&typeof j==='object'?j:{}}).catch(()=>{});
function embFor(...names){for(const n of names){const f=n&&EMB[String(n).trim()];if(f&&/^[^\/\\?#]+\.(png|jpe?g|webp|svg|gif)$/i.test(f))return './emblems/'+encodeURIComponent(f)}return ''}
function crestFail(img){const s=img.parentNode;if(img.classList.contains('ed')){s.classList.remove('hasdark');img.remove();return}s.classList.remove('img','hasdark');s.querySelectorAll('img').forEach(x=>x.remove());s.insertBefore(document.createTextNode(s.dataset.ch),s.firstChild)}
const WD=['日','月','火','水','木','金','土'];
function fmtDate(s,short){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');if(!m)return s||'日程未定';return (+m[2])+'/'+(+m[3])+(short?'':'（'+WD[new Date(+m[1],+m[2]-1,+m[3]).getDay()]+'）')}
function wd(s){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?WD[new Date(+m[1],+m[2]-1,+m[3]).getDay()]:''}
function daysUntil(s){const a=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||''),b=/^(\d{4})-(\d{2})-(\d{2})/.exec(jstToday());if(!a||!b)return null;return Math.round((Date.UTC(+a[1],+a[2]-1,+a[3])-Date.UTC(+b[1],+b[2]-1,+b[3]))/864e5)}
const order=ms=>[...ms].sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.kickoff||'').localeCompare(String(b.kickoff||'')));

async function json(file){
  if(DEMO)return demoData(file);
  const r=await fetch('../results/data/'+file,{cache:'no-store'});
  if(!r.ok)throw Error('HTTP '+r.status);
  return r.json();
}
/* 各クラブの手入力データ（new/data/teams.json）。無くても動く */
async function loadProfiles(){
  if(DEMO)return demoProfiles();
  try{const r=await fetch('./data/teams.json',{cache:'no-store'});if(!r.ok)return {teams:[]};return await r.json()}catch(_){return {teams:[]}}
}
function profileOf(t){
  if(!t)return null;
  const id=tkey(t),cands=[name(t),fullName(t),typeof t==='object'?t.univ:''].filter(has);
  const base=String(id).replace(/-[A-Z0-9]+$/,'');
  return PROFILES.find(p=>has(p.id)&&(p.id===id||p.id===base))||PROFILES.find(p=>(p.names||[]).some(n=>cands.includes(n)))||null;
}

let S={comp:'',data:null,roster:null,team:null,up:[],res:[]};
async function loadRoster(id){
  if(DEMO)return demoRoster();
  try{const r=await fetch('../results/data/'+encodeURIComponent(id)+'-roster.json',{cache:'no-store'});return r.ok?await r.json():null}catch(_){return null}
}

function collectTeams(d){
  const map=new Map();
  for(const m of d.matches||[])for(const t of [m.home,m.away]){const k=tkey(t);if(k&&name(t)!=='未定'&&!map.has(k))map.set(k,t)}
  for(const g of d.groups||[])for(const r of g.table||[]){const k=tkey(r.team);if(k&&!map.has(k))map.set(k,r.team)}
  return [...map.values()].sort((a,b)=>name(a).localeCompare(name(b),'ja'));
}
const isMe=t=>tkey(t)===tkey(S.team);
function outcome(m){
  if(!isDone(m))return null;
  const h=+m.score.home,a=+m.score.away,mine=isMe(m.home)?h:a,opp=isMe(m.home)?a:h;
  return mine>opp?'W':mine<opp?'L':'D';
}
const OUT={W:'勝',D:'分',L:'負'};

/* ---------- render ---------- */
function renderHero(row,ms){
  const t=S.team,p=profileOf(t);
  document.documentElement.style.setProperty('--team',teamColor(t));
  // 黒い背景の上の文字：暗いチームカラーは白を混ぜて読みやすくする
  document.documentElement.style.setProperty('--teamText',crestInk(teamColor(t))==='#fff'?'color-mix(in srgb,'+teamColor(t)+' 55%,var(--ink))':teamColor(t));
  document.title=fullName(t)+' | 北海道サッカーリーグ';
  $('crumbName').textContent=name(t);
  if(typeof t==='object'&&t.id)calBox($('calBox'),[{file:'t-'+t.id+'.ics',label:fullName(t)+'の試合'},{file:String(t.id).replace(/-[^-]*$/,'')+'.ics',label:(t.univ||name(t))+'のすべての大会の試合'}],'日程をカレンダーに入れる');
  $('heroCrest').innerHTML=crest(t,'xl');
  const hp=teamPhotoUrl(p,1600)||manualTeamPhoto(t);
  $('heroPh').innerHTML=hp?'<img src="'+esc(hp)+'" alt="" decoding="async" onerror="this.remove()">':'';
  $('teamTitle').textContent=(p&&has(p.displayName))?p.displayName:fullName(t);
  const univ=typeof t==='object'&&has(t.univ)?t.univ:'';
  $('teamSub').textContent=[univ!==$('teamTitle').textContent?univ:'',S.data.competition?.name||''].filter(has).join('　／　');
  const W=pick(row,['won','win','w']),D=pick(row,['drawn','draw','d']),L=pick(row,['lost','lose','l']);
  let gd=pick(row,['goalDiff','gd','diff']);
  if(gd==null&&pick(row,['goalsFor','gf'])!=null)gd=(+pick(row,['goalsFor','gf']))-(+pick(row,['goalsAgainst','ga'])||0);
  $('hRank').innerHTML=row?.rank!=null?esc(row.rank)+'<small>位</small>':'–';
  $('hPts').textContent=row?.points??'–';
  $('hWdl').textContent=W!=null?W+'-'+(D??0)+'-'+(L??0):'–';
  $('hGd').textContent=gd!=null?(+gd>0?'+'+gd:gd):'–';
  const last=ms.filter(isDone).slice(-5);
  const cells=last.map(m=>{const o=outcome(m);return '<i class="'+o+'" title="'+esc(fmtDate(m.date)+' vs '+name(isMe(m.home)?m.away:m.home))+'">'+OUT[o]+'</i>'});
  while(cells.length<5)cells.unshift('<i class="E">-</i>');
  $('hForm').innerHTML=cells.join('');
}
function duel(m,next){
  const done=isDone(m),d=daysUntil(m.date);
  return '<div class="duel">'+
    '<div class="t'+(isMe(m.home)?' me':'')+'">'+crest(m.home)+'<span>'+esc(name(m.home))+'</span></div>'+
    '<div class="c">'+(done?'<b>'+esc(m.score.home)+'-'+esc(m.score.away)+'</b>':'<b class="vs">VS</b>')+
      '<small>'+esc(fmtDate(m.date))+(m.kickoff?' '+esc(m.kickoff):'')+'</small>'+
      (next&&d>0?'<div class="cd">あと '+d+' 日</div>':next&&d===0?'<div class="cd">本日開催</div>':'')+'</div>'+
    '<div class="t'+(isMe(m.away)?' me':'')+'">'+crest(m.away)+'<span>'+esc(name(m.away))+'</span></div></div>';
}
function renderPair(){
  const nx=S.up[0],ls=S.res[0];
  const card=(m,next)=>!m?'<div class="mcard'+(next?' next':'')+'"><div class="top"><span class="lbl">'+(next?'NEXT MATCH':'LAST RESULT')+'</span></div><p class="empty" style="padding:8px 0">'+(next?'予定されている試合はありません。':'まだ試合結果はありません。')+'</p></div>':
    '<a class="mcard'+(next?' next':'')+'" href="'+detail(m._comp||S.comp,isDone(m)?m.matchId:'')+'"><div class="top"><span class="lbl">'+(next?'NEXT MATCH':'LAST RESULT')+'</span><span>'+esc(m.round||'')+(next?'':'　<span class="res '+outcome(m)+'">'+OUT[outcome(m)]+'</span>')+'</span></div>'+
    duel(m,next)+'<div class="foot">📍 '+esc(m.venue||'会場未定')+'</div></a>';
  $('pair').innerHTML=card(nx,true)+card(ls,false);
}
/* ホーム・アウェイがあるのは北海道リーグ（トップ）だけ。ブロックリーグ・決勝大会・カップ戦は出さない */
const hasHA=id=>/-TOP$/.test(String(id||''));
function renderMatches(which){
  const list=which==='up'?S.up:S.res;
  $('tabUp').setAttribute('aria-selected',String(which==='up'));
  $('tabRes').setAttribute('aria-selected',String(which!=='up'));
  if(!list.length){$('matchList').innerHTML='<p class="empty">'+(which==='up'?'予定されている試合はありません。':'まだ試合結果はありません。')+'</p>';return}
  $('matchList').classList.toggle('noha',!list.some(m=>hasHA(m._comp||S.comp)));
  $('matchList').innerHTML=list.map(m=>{
    const home=isMe(m.home),opp=home?m.away:m.home,o=outcome(m);
    const mine=o?(home?m.score.home:m.score.away):null,their=o?(home?m.score.away:m.score.home):null;

/* 大会の一覧と、大会ごとのデータ（同じクラブは、どの大会でも同じチームID） */
let COMPS=[];const CDATA=new Map(),CROSTER=new Map(),CTEAMS=new Map();
const ALL='ALL';
const compShort=n=>String(n||'').replace(/^\d{4}年度\s*/,'').replace(/第\d+回\s*/g,'').replace(/^北海道サッカーリーグ$/,'北海道リーグ').replace(/^北海道サッカーリーグ\s*(?=\S)/,'').replace(/ブロックリーグ決勝大会/,'決勝大会').replace(/ブロックリーグ$/,'ブロック').replace(/^(全国社会人|全国クラブ).*$/,'$1予選').replace(/^北海道サッカー選手権.*$/,'北海道選手権').trim()||n;
function compData(id){
  if(!CDATA.has(id))CDATA.set(id,json(encodeURIComponent(id)+'.json').then(d=>{if(!d.ok)throw Error('大会データを取得できません');return d}));
  return CDATA.get(id);

/* すべての大会：その年度の全大会の試合・得点・出場記録をまとめる（表示はクラブの分だけ） */
async function mergedData(){
  const ds=(await Promise.all(COMPS.map(c=>compData(c.id).catch(()=>null)))).map((d,i)=>d&&{d,c:COMPS[i]}).filter(Boolean);
  const out={ok:true,competition:{id:ALL,name:'すべての大会'},matches:[],groups:[],scorers:[],assists:[],playerStats:[],cardTable:[],updatedAt:''};
  const sc=new Map(),ps=new Map();
  for(const {d,c} of ds){
    if(String(d.updatedAt||'')>out.updatedAt)out.updatedAt=d.updatedAt;
    for(const m of d.matches||[])out.matches.push({...m,_comp:c.id,_compShort:compShort(c.name)});
    out._groups=(out._groups||[]).concat([{comp:c.id,groups:d.groups||[]}]);
    for(const r of d.scorers||[]){const k=tkey(r.team)+'|'+(r.playerId||r.name);const x=sc.get(k)||{...r,count:0};x.count+=+r.count||0;sc.set(k,x)}
    for(const t of d.playerStats||[]){
      const k=tkey(t.team);const x=ps.get(k)||{team:t.team,matches:0,players:[]};x.matches+=+t.matches||0;
      for(const p of t.players||[]){const y=x.players.find(q=>(q.id&&q.id===p.id)||q.name===p.name);
        if(y){for(const f of ['apps','starts','min','goals','assists','yc','rc'])y[f]=(+y[f]||0)+(+p[f]||0)}else x.players.push({...p})}
      ps.set(k,x);
    }
  }
  out.scorers=[...sc.values()].sort((a,b)=>b.count-a.count);
  let prev=null,rk=0;out.scorers.forEach((r,i)=>{if(r.count!==prev){rk=i+1;prev=r.count}r.rank=rk});
  out.playerStats=[...ps.values()];
  return out;
}

    // 大会を切り替えても、同じクラブがいればそのまま表示
    if(id===ALL){
      // 順位表は、そのクラブが出たリーグ戦（一覧の先に並ぶ大会）のもの。クラブを決めてから選ぶ
      const pickTable=k=>{const g=(d._groups||[]).find(x=>x.groups.some(g=>(g.table||[]).some(r=>tkey(r.team)===k)));d.groups=g?g.groups:[];d._tableComp=g?g.comp:''};
      const first=teams.find(x=>tkey(x)===wanted)||(has(univ)&&teams.find(x=>univOf(x)===univ))||teams[0];
      pickTable(first?tkey(first):'');
    }
    showTeam(teams,wanted,univ);
    renderCompTabs();
  }catch(e){
    $('teamTitle').textContent='読み込みに失敗しました';
    for(const k of ['pair','matchList','miniTable','scorers','recordBox'])$(k).innerHTML='<p class="empty">データを表示できません：'+esc(e.message)+'</p>';
  }
}


(async()=>{
  let d;
  try{d=await json('competitions.json')}

    if(!/github\.io$/.test(location.hostname)){DEMO=true;d=await json('competitions.json')}
    else{$('teamTitle').textContent='大会情報を取得できません';return}
  }
  $('demo').hidden=!DEMO;
  PROFILES=((await loadProfiles()).teams||[]);
  await embReady;await phReady;
  // 表示する年度（season.js）
  const cs=(await pickSeason(d.competitions||[],id=>compData(id).then(x=>(x.matches||[]).length))).comps;
  if(!cs.length){$('teamTitle').textContent='大会が登録されていません';return}
  COMPS=cs;
  // どの大会にどのクラブが出たか（タブを出す大会を決める）。読めない大会は飛ばす
  await Promise.all(cs.map(c=>compData(c.id).then(d=>CTEAMS.set(c.id,collectTeams(d).map(tkey))).catch(()=>CTEAMS.set(c.id,[]))));
  const comp=PARAMS.get('comp')&&cs.some(c=>c.id===PARAMS.get('comp'))?PARAMS.get('comp'):ALL;
  $('comptabs').addEventListener('click',e=>{
    const b=e.target.closest('button[data-id]');if(!b||b.dataset.id===S.comp)return;
    loadComp(b.dataset.id,S.team?tkey(S.team):null,S.team?univOf(S.team):'');
  });
  await loadComp(comp,PARAMS.get('team'));
})();
