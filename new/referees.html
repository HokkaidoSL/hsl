<meta property="og:title" content="審判の担当 | 北海道サッカーリーグ">
<meta property="og:description" content="北海道サッカーリーグの公式記録から集計した、審判員ごとの担当試合数（主審・副審・第4審）">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
/* 審判の担当だけの部品（色・影・角丸は hsl.css の変数だけ） */
.main{padding-top:24px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:12px}
.crumb a:hover{color:var(--ink);text-decoration:underline}
/* しぼり込み（ピル型） */
.rf .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.rf select,.rf input{font:inherit;font-size:15px;font-weight:700;min-height:44px;padding:0 16px;border:0;border-radius:var(--r-pill);background-color:var(--card2);color:var(--ink);min-width:0}
.rf select{appearance:none;-webkit-appearance:none;padding-right:36px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.rf select option{background:var(--card);color:var(--ink)}
.rf input{flex:1 1 160px;font-weight:400}
.rf input::placeholder{color:var(--muted);opacity:1}
.rf .sum{font-size:13px;color:var(--muted);margin:0 0 10px}
/* 並べかえ */
.rf .sortb{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.rf .sortb button{border:0;background:var(--card2);color:var(--ink);border-radius:var(--r-pill);padding:0 16px;min-height:44px;font-size:14px;font-weight:700;cursor:pointer}
.rf .sortb button[aria-pressed=true]{background:var(--ink);color:var(--navy)}
/* 表 */
.rf .card{overflow:hidden}
.rf table{border-collapse:collapse;width:100%;font-size:14px}
.rf th,.rf td{padding:10px 8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.rf th{background:var(--card2);font-size:12px;color:var(--muted);font-weight:700;border-top:0}
.rf th:first-child,.rf td:first-child{padding-left:16px}
.rf th:last-child,.rf td:last-child{padding-right:16px}
.rf th.l,.rf td.l{text-align:left}
.rf td{font-family:var(--num);font-size:16px;font-weight:700}
.rf td.nm,.rf td.yr,.rf tr.det td,.rf td[colspan]{font-family:"Noto Sans JP",system-ui,sans-serif;font-size:14px}
.rf td.nm button{border:0;background:none;padding:0;min-height:44px;font:inherit;font-weight:700;color:var(--logo-b);text-align:left;cursor:pointer}
.rf td.nm button:after{content:"▼";font-size:12px;display:inline-block;transform:scale(.8);margin-left:6px;color:var(--muted)}
.rf td.nm button[aria-expanded=true]:after{content:"▲"}
.rf td.nm{padding-top:0;padding-bottom:0}
.rf td.b{font-weight:800;font-size:18px}
.rf td.yr{font-size:12px;color:var(--muted);font-weight:400}
.rf tr.det td{background:var(--card2);white-space:normal;text-align:left;padding:8px 16px 12px;font-weight:400}
.rf .ml{list-style:none;margin:0;padding:0;font-size:13px}
.rf .ml li{display:grid;grid-template-columns:86px 1fr 52px;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.rf .ml li:last-child{border-bottom:0}
.rf .ml a{color:var(--logo-b);font-weight:700}
.rf .ml .role{font-weight:700;text-align:right}
.rf .ml small{display:block;color:var(--muted);font-size:12px}
.rf .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.rf .note a{color:var(--logo-b)}
@media(max-width:560px){.rf td.yr,.rf th.yr{display:none}.rf th,.rf td{padding:9px 6px}.rf th:first-child,.rf td:first-child{padding-left:12px}.rf th:last-child,.rf td:last-child{padding-right:12px}.rf .ml li{grid-template-columns:72px 1fr 46px}.rf .sortb button{padding:0 12px;font-size:13px}}
</style>
</head>
<body>
<script src="./hdr.js?v=20261021"></script>
<script>hslChrome('')</script>

<section class="phead"><div class="wrap">
  <div class="crumb"><a href="./">ホーム</a> ／ <a href="./history.html">歴代成績</a> ／ 審判の担当</div>
  <div class="eyebrow">REFEREES</div><h1>審判の担当</h1>
</div></section>
<main class="wrap main">
  <div class="rf">
    <p class="note" style="margin:0 0 14px">公式記録に書かれた審判団（主審・副審・第4審）から、審判員ごとに担当した試合の数を集計しています。名前を押すと、担当した試合の一覧が出ます。</p>
    <div class="bar">
      <select id="yr" aria-label="年度"></select>
      <select id="cp" aria-label="大会"></select>
      <input id="q" type="search" placeholder="名前でさがす" aria-label="名前でさがす">
    </div>
    <div class="sortb" id="sortb" role="group" aria-label="並べかえ">
      <button data-k="t" aria-pressed="true">合計の多い順</button><button data-k="r" aria-pressed="false">主審の多い順</button><button data-k="a" aria-pressed="false">副審の多い順</button><button data-k="f" aria-pressed="false">第4審の多い順</button>
    </div>
    <p class="sum" id="sum"></p>
    <div class="card scroll"><table id="tbl"><tbody><tr><td><span class="sk"></span></td></tr></tbody></table></div>
    <p class="note">集計の対象は、審判の名前が公式記録に入っている試合です（2019年度からの北海道サッカーリーグなど）。不戦試合や、結果だけを入れた試合は入っていません。名前の書き方のちがい（髙/高 など）は1人にまとめています。</p>
  </div>
</main>

<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const QS=new URLSearchParams(location.search);
const D='../results/data/';
const getJSON=f=>fetch(D+f,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
const CSHORT={TOP:'北海道リーグ',SD:'札幌・道央ブロック',DN:'道南ブロック',DT:'道東・道北ブロック',BF:'ブロック決勝大会',SC:'全国社会人予選',CC:'全国クラブ予選',HC:'北海道選手権'};
const code=id=>String(id).split('-').pop();
const nk=s=>String(s||'').normalize('NFKC').replace(/[\s　]/g,'');
const ROLE=['主審','副審','副審','第4審'],RK=['r','a','a','f'];
let M=[],ALIAS={},S={yr:QS.get('year')||'',cp:QS.get('comp')||'',q:'',k:'t',open:''};
const canon=n=>{const k=nk(n);return ALIAS[k]||k};
async function boot(){
  try{const a=await getJSON('referee-aliases.json');for(const [k,v] of Object.entries(a.aliases||{}))ALIAS[nk(k)]=nk(v)}catch(e){}
  const [cl,ar]=await Promise.all([getJSON('competitions.json').catch(()=>({competitions:[]})),getJSON('referees-archive.json').catch(()=>({comps:[],matches:[]}))]);
  M=ar.matches.map(r=>({c:r[0],id:r[1],d:r[2],rd:r[3],h:r[4],a:r[5],refs:r.slice(6,10)}));
  // この一覧にない大会（大会運営システムが書き出す新しい大会）は、試合のデータから数える
  const done=new Set(ar.comps||[]);
  const rest=(cl.competitions||[]).filter(c=>!done.has(c.id));
  const more=await Promise.all(rest.map(c=>getJSON(encodeURIComponent(c.id)+'-matches.json').then(md=>Object.entries(md.details||{}).map(([id,d])=>{
    const i=d.info||{},m=d.match||{};const refs=[i.referee,i.ar1,i.ar2,i.fourth].map(x=>String(x||'').trim());
    return refs.some(Boolean)?{c:c.id,id,d:m.date||'',rd:m.round||'',h:(m.home||{}).short||'',a:(m.away||{}).short||'',refs}:null}).filter(Boolean)).catch(()=>[])));
  M=M.concat(...more);
  const years=[...new Set(M.map(m=>m.c.slice(0,4)))].sort().reverse();
  $('yr').innerHTML='<option value="">すべての年度</option>'+years.map(y=>'<option value="'+y+'">'+y+'年度</option>').join('');
  const codes=[...new Set(M.map(m=>code(m.c)))].sort((a,b)=>Object.keys(CSHORT).indexOf(a)-Object.keys(CSHORT).indexOf(b));
  $('cp').innerHTML='<option value="">すべての大会</option>'+codes.map(c=>'<option value="'+c+'">'+esc(CSHORT[c]||c)+'</option>').join('');
  $('yr').value=years.includes(S.yr)?S.yr:'';$('cp').value=codes.includes(S.cp)?S.cp:'';S.yr=$('yr').value;S.cp=$('cp').value;
  $('yr').onchange=()=>{S.yr=$('yr').value;S.open='';draw()};
  $('cp').onchange=()=>{S.cp=$('cp').value;S.open='';draw()};
  $('q').oninput=()=>{S.q=nk($('q').value);draw()};
  $('sortb').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;S.k=b.dataset.k;draw()};
  $('tbl').onclick=e=>{const b=e.target.closest('[data-n]');if(!b)return;S.open=S.open===b.dataset.n?'':b.dataset.n;draw()};
  draw();
}
function draw(){
  document.querySelectorAll('#sortb button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===S.k)));
  const ms=M.filter(m=>(!S.yr||m.c.startsWith(S.yr+'-'))&&(!S.cp||code(m.c)===S.cp));
  const P=new Map();
  for(const m of ms)m.refs.forEach((n,i)=>{if(!n)return;const k=canon(n);
    const p=P.get(k)||{k,names:new Map(),t:0,r:0,a:0,f:0,ys:new Set(),list:[]};
    p.names.set(n,(p.names.get(n)||0)+1);p.t++;p[RK[i]]++;p.ys.add(m.c.slice(0,4));p.list.push({m,role:ROLE[i]});P.set(k,p)});
  let L=[...P.values()].map(p=>({...p,name:([...p.names.keys()].find(n=>nk(n)===p.k))||[...p.names].sort((a,b)=>b[1]-a[1])[0][0]}));  // まとめた先の書き方があればそれを出す
  L.sort((a,b)=>b[S.k]-a[S.k]||b.t-a.t||a.name.localeCompare(b.name,'ja'));
  let rk=0,prev=null;L.forEach((p,i)=>{if(p[S.k]!==prev){rk=i+1;prev=p[S.k]}p.rank=rk});
  const shown=S.q?L.filter(p=>p.k.includes(S.q)):L;
  $('sum').textContent=ms.length+'試合・'+L.length+'人'+(S.q?'（'+shown.length+'人が見つかりました）':'');
  const yrs=p=>{const y=[...p.ys].sort();return y.length>1?y[0]+'〜'+y[y.length-1]:y[0]};
  $('tbl').innerHTML='<thead><tr><th class="l">順位</th><th class="l">審判員</th><th>合計</th><th>主審</th><th>副審</th><th>第4審</th><th class="yr l">年度</th></tr></thead><tbody>'+
    (shown.map(p=>'<tr><td class="l">'+p.rank+'</td><td class="l nm"><button data-n="'+esc(p.k)+'" aria-expanded="'+(S.open===p.k)+'">'+esc(p.name)+'</button></td><td class="b">'+p.t+'</td><td>'+p.r+'</td><td>'+p.a+'</td><td>'+p.f+'</td><td class="yr l">'+esc(yrs(p))+'</td></tr>'+
      (S.open===p.k?'<tr class="det"><td colspan="7"><ul class="ml">'+p.list.sort((a,b)=>String(b.m.d).localeCompare(String(a.m.d))).map(x=>'<li><span>'+esc(x.m.d.replace(/-/g,'/'))+'<small>'+esc((CSHORT[code(x.m.c)]||'')+' '+x.m.rd)+'</small></span><a href="./results.html?comp='+encodeURIComponent(x.m.c)+'&match='+encodeURIComponent(x.m.id)+'">'+esc(x.m.h)+' vs '+esc(x.m.a)+'</a><span class="role">'+x.role+'</span></li>').join('')+'</ul></td></tr>':'')).join('')||'<tr><td class="l" colspan="7">見つかりませんでした</td></tr>')+'</tbody>';
  try{history.replaceState(null,'','?'+[S.yr&&'year='+S.yr,S.cp&&'comp='+S.cp].filter(Boolean).join('&'))}catch(e){}
}
boot().catch(e=>{$('tbl').innerHTML='<tr><td>読み込めませんでした。時間をおいて開き直してください。</td></tr>'});
</script>
<script src="./alert.js?v=20261020"></script>
<script src="./hit.js?v=20261020"></script>
</body>
</html>
